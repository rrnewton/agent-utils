[workspace]
members = ["."]

[package]
name = "gent-talk"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rrnewton/agent-utils"
authors = ["Ryan Newton"]
description = "A voice-agent bridge that reads and answers about Discord channels from a phone."
publish = false
# There are two binaries, and every `cargo run` in the README, in scripts/, and in CI means the
# server. Without this, adding the mock turned all of them into "could not determine which binary
# to run" — a second target must not change what the first command in the quickstart does.
default-run = "gent-talk"

[lib]
name = "gent_talk"
path = "src/lib.rs"

[[bin]]
name = "gent-talk"
path = "src/main.rs"

# The offline ElevenLabs substitute, as a process, for the browser harness and the smoke script.
# NOTE FOR THE CONTAINERFILE: an explicit `[[bin]]` whose path does not exist makes cargo refuse
# to read this manifest at all, which would break the image's dependency-cache stage — that stage
# writes only src/main.rs and src/lib.rs. Containerfile creates a matching placeholder; if this
# target is renamed or moved, that placeholder has to move with it.
[[bin]]
name = "gent-talk-mock-elevenlabs"
path = "src/bin/mock_elevenlabs.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# `tzdb-bundle-always` compiles the IANA database into the binary. The runtime image has no
# `tzdata` package, and a server that fell back to UTC for want of one would silently reproduce
# the wrong-zone bug this dependency was added to fix. See `src/clock.rs`.
jiff = { version = "0.2.24", default-features = false, features = [
    "std",
    "tzdb-bundle-always",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
# The live ElevenLabs client is exercised against a one-shot loopback HTTP server, which is what
# pins the API key to a HEADER rather than the query string. That needs raw sockets in tests.
tokio = { version = "1", features = ["io-util", "net"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
missing_docs = "deny"
