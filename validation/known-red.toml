# Known-red gate steps (#2114 gate-known-red-aware-verdict).
#
# Steps that fail on unrelated trees and on clean main, each with its
# tracking issue as its mark. gate.py reads this file: a gate whose
# ONLY failed steps are listed here (unexpired) is labelled
# only-known-red in its ledger row, so the coordinator can waive it
# at once instead of paying for solo reruns. An unlisted failure is
# never labelled known-red.
#
# Every entry expires: `expires` is an ISO date, and an entry stops
# matching the day after it. Renew an entry only by naming the issue
# that still tracks the failure; an expired entry that still matches
# is named in the gate log so it cannot silently live forever.
# `step` is an exact step name or an fnmatch glob.
version = 1

