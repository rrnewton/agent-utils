description: Tool-owned Rust regression suites

# The suites build into rs/target/validation-tests, never rs/target itself. rs/target holds the
# tracked launchers' cache (rs/bin/cargo-runner). `cargo test` relinks a package's binaries there
# with its dev-dependency features, so the next launcher call, from any step running beside the
# suite, found its stamped binary replaced and ran `cargo clean` for that package, deleting the
# test binaries of the suite still running: a test that re-executed itself got ENOENT.
#
# --no-fail-fast: a package has several test binaries, and by default cargo stops at the first
# failing one, so a failure there hid the rest of that package's tests.
#
# RUST_TEST_THREADS: one test at a time, except in the three packages whose serial runs were long
# enough to matter and that are safe to share (2026-10-24, sums of case times: agentctl 357 s,
# wrkslotsd 229 s, gh-paced 179 s), which run four. Each passed three consecutive four-thread
# runs here, in 125-166 s, 78-96 s and 49-50 s, and a gate. dagrun (201 s) stays serial: its
# suite passed three four-thread runs by hand, but inside a gate, where it runs in a delegated
# cgroup, cli::tests::delegated_parent_clamps_explicit_run_budgets_and_rejects_wide_cpuset saw a
# default CPU budget of 1 instead of 2 while its neighbours ran. The other packages' tests sum
# to seconds, and the chat-subscription conformance tests keep fixed sub-second deadlines that
# contention can miss.

resource_caps:
  cargo-target: 4

steps:
  - group: agentctl
    job: test
    desc: agentctl Rust tests
    # TMPDIR: a memory-backed scratch directory of the step's own (#869
    # agentctl-test-fsync-churn). The chat state tests create, fsync and rename thousands of
    # files of under 1 KB; on a copy-on-write /tmp each fsync also writes metadata and log
    # blocks, so the suite wrote about 18 GiB per run to the host disk, and on tmpfs about
    # 16 MB. The fsyncs stay: only the backing store changes. /dev/shm comes first because its
    # path is short: a test's control socket under $XDG_RUNTIME_DIR/at.XXXXXX/... reached the
    # 108-byte limit of a Unix socket path.
    cmd: >-
      host_target="$(rustc -vV | sed -n 's/^host: //p')" && test -n "$host_target" &&
      scratch="$(mktemp -d /dev/shm/at.XXXXXX 2>/dev/null || mktemp -d "${XDG_RUNTIME_DIR:-/tmp}/at.XXXXXX")" &&
      trap 'rm -rf "$scratch"' EXIT &&
      TMPDIR="$scratch" RUST_TEST_THREADS=4 python3 scripts/case_timings.py run-cargo -- cargo test --release --no-fail-fast --manifest-path rs/Cargo.toml
      --target "$host_target" --target-dir rs/target/validation-tests -p agentctl ${DAGRUN_EXTRA_ARGS}
    cmdtype: cargo-test
    labels: [validation-workspace, validation-rust-workspace-tests, component-agentctl]
    timeout: 19200
    cpu_timeout: 2400
    hint: &rust_test_hint
      resources: {cargo-target: 1}
      est_duration_s: 180
      classification: cpu-bound
      preferred_inner_jobs: 8
      rss_baseline_bytes: 3221225472

  - group: agent-queue
    job: test
    desc: agent-queue Rust tests
    cmd: >-
      host_target="$(rustc -vV | sed -n 's/^host: //p')" && test -n "$host_target" &&
      RUST_TEST_THREADS=1 python3 scripts/case_timings.py run-cargo -- cargo test --release --no-fail-fast --manifest-path rs/Cargo.toml
      --target "$host_target" --target-dir rs/target/validation-tests -p agent-queue ${DAGRUN_EXTRA_ARGS}
    cmdtype: cargo-test
    labels: [validation-workspace, validation-rust-workspace-tests, component-agentctl]
    timeout: 9600
    cpu_timeout: 1200
    hint: *rust_test_hint

  - group: agent-harness
