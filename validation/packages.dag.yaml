description: Tool-owned offline Python build-and-install smoke checks, and standalone subsets

resource_caps:
  python-package: 4

# Each step builds a wheel and an sdist and smoke-installs them in a fresh environment: about 6
# CPU-seconds on a fast workstation and more than 10 on a hosted runner, where dagrun's default
# 10 s budget for a step that declares none failed `wrkviz` with CPU-TIMEOUT. 120 bounds a hang,
# not a slow build; the 600 s wall limit stays the outer bound.
steps:
  - group: python
    job: agentctl
    desc: build and smoke-install the agentctl Python distribution
    cmd: python3 scripts/check_python_packages.py --project agentctl
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-agentctl]
    timeout: 600
    cpu_timeout: 120
    hint: &python_package_hint
      resources: {python-package: 1}
      est_duration_s: 8
      classification: cpu-bound
      preferred_inner_jobs: 1
      rss_baseline_bytes: 1073741824

  - group: python
    job: dagrun
    desc: build and smoke-install the dagrun Python distribution
    cmd: python3 scripts/check_python_packages.py --project dagrun
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-dagrun]
    timeout: 600
    cpu_timeout: 120
    hint: *python_package_hint

  - group: python
    job: experiment-runner
    desc: build and smoke-install the experiment runner Python distribution
    cmd: python3 scripts/check_python_packages.py --project parallel-experiment-runner
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-experiment-runner]
    timeout: 600
    cpu_timeout: 120
    hint: *python_package_hint

  - group: python
    job: herdr-run
    desc: build and smoke-install the herdr-run Python distribution
    cmd: python3 scripts/check_python_packages.py --project herdr-run
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-herdr-run]
    timeout: 600
    cpu_timeout: 120
    hint: *python_package_hint

  - group: python
    job: planner
    desc: build and smoke-install the planner Python distribution
    cmd: python3 scripts/check_python_packages.py --project pr-landing-planner
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-planner]
    timeout: 600
    cpu_timeout: 120
    hint: *python_package_hint

  - group: python
    job: local-ci-hub
    desc: build and smoke-install the local-ci-hub Python distribution
    cmd: python3 scripts/check_python_packages.py --project local-ci-hub
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-local-ci-hub]
    timeout: 600
    cpu_timeout: 120
    hint: *python_package_hint

  - group: python
    job: tick-hub
    desc: build and smoke-install the tick-hub Python distribution
    cmd: python3 scripts/check_python_packages.py --project tick-hub
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-tick-hub]
    timeout: 600
    cpu_timeout: 120
    hint: *python_package_hint

  - group: python
    job: wrkslots
    desc: build and smoke-install the wrkslots Python distribution
    cmd: python3 scripts/check_python_packages.py --project wrkslots
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-wrkslots]
    timeout: 600
    cpu_timeout: 120
    hint: *python_package_hint

  - group: python
    job: wrkviz
    desc: build and smoke-install the wrkviz Python distribution
    cmd: python3 scripts/check_python_packages.py --project wrkviz
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-wrkviz]
    timeout: 600
    cpu_timeout: 120
    hint: *python_package_hint

  # Standalone subsets (#498 suite-a-la-carte): install ONE tool alone, with no other suite
  # command, sibling package, or Herdr visible, and run its quickstart workflow end to end. The
  # package steps above prove each artifact installs alone; these prove it also works alone.
  # The wrkslots lifecycle spends most of its time in removal's process census, which scales with
  # the host's process count: about 40 CPU-seconds on a busy shared workstation, a few on a runner.
  - group: standalone
    job: tick-hub
    desc: install only tick-hub in a clean environment and run its quickstart ticks
    cmd: python3 scripts/check_standalone.py --subset tick-hub
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-tick-hub]
    timeout: 300
    cpu_timeout: 60
    hint:
      resources: {python-package: 1}
      est_duration_s: 3
      classification: cpu-bound
      preferred_inner_jobs: 1
      rss_baseline_bytes: 536870912

  - group: standalone
    job: wrkslots
    desc: install only wrkslots in a clean environment and run a whole slot lifecycle
    cmd: python3 scripts/check_standalone.py --subset wrkslots
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-wrkslots]
    timeout: 900
    cpu_timeout: 300
    hint:
      resources: {python-package: 1}
      est_duration_s: 45
      classification: cpu-bound
      preferred_inner_jobs: 1
      rss_baseline_bytes: 536870912
