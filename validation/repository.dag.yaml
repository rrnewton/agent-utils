# Repository-wide checks that are not owned by one tool. Tool-specific regression, packaging, and
# cross-language fragments are included by `validation.dag.yaml` beside this file.

description: Shared repository hygiene, generated-document, build, and lint checks

resource_caps:
  # Workspace tests and clippy are Cargo builds under rs/target. Count every Cargo consumer
  # against one cap so a lint lane cannot silently turn four deliberately bounded test builds
  # into five.
  cargo-target: 4

steps:
  - group: hygiene
    job: component-manifest
    desc: every Python test has exactly one declared owner
    cmd: python3 scripts/run_component_tests.py --self-test
    jobs_flag: ""
    labels: [validation-hygiene]
    timeout: 480
    cpu_timeout: 60
    hint:
      est_duration_s: 1
      classification: light
      # The inventory grew to 185 component tests and touched the former 200 MiB runtime ceiling,
      # recording memory.events.max despite passing. A 256 MiB authored floor yields a 320 MiB cap
      # so future measurements remain uncensored while the hygiene check stays tightly bounded.
      rss_baseline_bytes: 268435456

  - group: hygiene
    job: pytest-sharder
    desc: deterministic shards are disjoint and complete
    cmd: python3 scripts/run_pytest_shard.py --self-test
    jobs_flag: ""
    labels: [validation-hygiene]
    timeout: 480
    cpu_timeout: 60
    hint:
      est_duration_s: 1
      classification: light
      rss_baseline_bytes: 134217728
      # The real cancellation self-test launches a supervised pytest worker and child. Historical
      # pre-test feedback lowered MemoryMax to 80,281,600 B and OOM-killed that new process tree;
      # keep bounded headroom for the test's deliberate three-process peak.
      hard_mem_max_bytes: 268435456

  - group: hygiene
    job: editions-self-test
    desc: prove the editions mirror-state guard can fail
    cmd: python3 scripts/check_editions.py --self-test
    jobs_flag: ""
    labels: [validation-hygiene]
    timeout: 480
