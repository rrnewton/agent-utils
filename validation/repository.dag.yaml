      host_target="$(rustc -vV | sed -n 's/^host: //p')" && test -n "$host_target" &&
      cargo clippy --release --workspace --all-targets --manifest-path rs/Cargo.toml
      --target "$host_target" ${DAGRUN_EXTRA_ARGS} -- -D warnings
    deps: [build.rust-launchers]
    cmdtype: cargo-build
    labels: [validation-workspace, validation-rust]
    timeout: 19200
    cpu_timeout: 2400
    hint:
