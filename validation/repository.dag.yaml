    desc: wrkslots daemon Rust lib tests in the debug profile (catches stack frames that only overflow unoptimised, #1003)
    cmd: >-
      host_target="$(rustc -vV | sed -n 's/^host: //p')" && test -n "$host_target" &&
      RUST_TEST_THREADS=4 python3 scripts/case_timings.py run-cargo -- cargo test --no-fail-fast --manifest-path rs/Cargo.toml
      --target "$host_target" --target-dir rs/target/validation-tests -p wrkslotsd --lib ${DAGRUN_EXTRA_ARGS}
    deps: [build.rust-launchers]
    cmdtype: cargo-test
    labels: [validation-workspace, validation-rust, component-wrkslots]
