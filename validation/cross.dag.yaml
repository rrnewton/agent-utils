description: Tool-owned cross-language observable-behavior checks

steps:
  - group: check
    job: mypy
    desc: strict typing and no-Any policy for cross-language Python inputs
    cmd: >-
      MYPYPATH=py python3 -m mypy --config-file py/pyproject.toml --strict
      --disallow-any-explicit --disallow-any-decorated
      cross examples/dagrun-scaling-workload.py &&
      python3 scripts/check_no_any.py cross examples/dagrun-scaling-workload.py
    jobs_flag: ""
    labels: [validation-cross]
    timeout: 480
    cpu_timeout: 60
    hint:
      est_duration_s: 3
      classification: light
      rss_baseline_bytes: 268435456

  - group: dagrun
    job: cpu-footprint
    desc: CPU-footprint contract tests
    cmd: PYTHONPATH=scripts python3 -m pytest -p run_pytest_shard -q cross/test_cpu_footprint.py
    jobs_flag: ""
    labels: [validation-cross, component-dagrun]
    timeout: 480
    cpu_timeout: 60
    hint:
      est_duration_s: 2
      classification: light
      rss_baseline_bytes: 268435456

  - group: dagrun
    job: differential
    desc: dagrun Python and Rust commands agree
    # Partial by declaration, and only for one structural reason: this node runs inside the
    # parent-owned delegated cgroup, where the harness must not create a live systemd scope, so
    # the live pin-run cases are listed as skipped rather than run. They run only when someone
    # invokes `make cross` by hand at top level; no automated lane does
    # (https://github.com/rrnewton/agent-utils/issues/165). Boxing stays required here; a lane
    # that cannot box must declare that itself (AGENT_UTILS_CROSS_ALLOW_SKIP=boxing).
    # A partial run exits 0, so dagrun shows this node as a plain PASS with the PARTIAL line only
    # in its brackets; scripts/validate.py lists the skipped checks in its own summary.
    cmd: python3 cross/differential.py --tool dagrun --allow-skip delegated-live-scope
    jobs_flag: ""
    # The harness has one live boxed CPU-bandwidth case. Let the outer scheduler deliver the
    # admitted width explicitly so that case scales to a smaller runner instead of claiming an
    # eight-worker requirement that its command cannot honor.
    jobs_env: AGENT_UTILS_VALIDATION_JOBS
    labels: [validation-cross, component-dagrun]
    delegated_children: true
    timeout: 19200
    cpu_timeout: 2400
    hint:
      est_duration_s: 180
      classification: latency-bound
      # Eight remains the preferred/full-strength width. jobs_env makes four-core CI a real
      # four-core version of the same aggregate-bandwidth contract rather than an oversubscribed
      # or falsely described eight-core run.
      # The CPA memory-cap check needs all eight cores. scripts/validate.py plans with
      # --planner critical-path, which never changes this width from profile history, so the node
      # gets fewer only from an input the caller sets: a host with fewer than eight usable CPUs,
      # VALIDATE_MAX_CPUS below eight, --cores below eight or --planner cpa in
      # VALIDATE_DAGRUN_FLAGS, or a smaller CPU ceiling inherited from an outer dagrun. The check
      # is then an eight-cpu skip, which this command does not allow, so the node ends INCOMPLETE
      # until the caller sets AGENT_UTILS_CROSS_ALLOW_SKIP=eight-cpu, as the hosted lanes do. The
      # width is left resizable rather than fixed at eight: a fixed width over the run's
      # --max-cpus is refused, which would stop four-core hosted runners from running the node.
      preferred_inner_jobs: 8
      rss_baseline_bytes: 2147483648

  - group: dagrun
    job: cpuset-differential
    desc: cpuset allocator Python and Rust commands agree
    # Partial for the same structural reason as dagrun.differential: the live-scope cases
    # (selftest, interop, wrapped help, signal status) are listed as skipped inside the
    # delegated cgroup. They run, with full coverage, only when someone invokes `make cross` by
    # hand at top level; no automated lane does
    # (https://github.com/rrnewton/agent-utils/issues/165).
    cmd: python3 cross/differential.py --tool cpuset-alloc --allow-skip delegated-live-scope
    jobs_flag: ""
    labels: [validation-cross, component-dagrun]
    delegated_children: true
    timeout: 9600
    cpu_timeout: 1200
    hint: &cross_hint
      est_duration_s: 180
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 2147483648

  - group: tick-hub
    job: differential
    desc: tick-hub Python and Rust commands agree
    cmd: python3 cross/differential.py --tool tick-hub
    jobs_flag: ""
    labels: [validation-cross, component-tick-hub]
    timeout: 9600
    cpu_timeout: 1200
    hint: *cross_hint

  - group: planner
    job: differential
    desc: pr-landing-planner Python and Rust commands agree
    cmd: python3 cross/differential.py --tool pr-landing-planner
    jobs_flag: ""
    labels: [validation-cross, component-planner]
    timeout: 9600
    cpu_timeout: 1200
    hint:
      est_duration_s: 180
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 2147483648
      # A successful full-graph sample peaked at 201,678,848 B. Sparse profile feedback lowered
      # the following run's MemoryMax to 252,096,512 B; it reached that ceiling and recorded three
      # OOM kills. A boxed retry peaked at 288,268,288 B with no OOM. Keep 512 MiB explicit without
      # inflating the other differential steps that continue to share the general baseline above.
      hard_mem_max_bytes: 536870912

  # DISABLED by default (owner reply 346, 2026-11-10; #1249
  # cross-differentials-robust; one consuming-project name redacted):
  # "Insane. I hate tests that are real time
  # sensitive. We fought this battle with [redacted]. Disable those tests and
  # have an agent work to bring them back when they're robust. Each product
  # lane must make its tests fast, high signal, and robust to running on a
  # hot machine (>75% cpu on 316 HW threads). AND there should be good test
  # selection so we are not running tests for agent-util A when only B is
  # modified. Anything else should be disabled until we can improve it."
  # scripts/validate.py selects the five below only with the explicit
  # --cross-differentials opt-in; no default, --all, or --cross-all run
  # selects them, so the gate-exclusive phase is empty.
  #
  # The herdr-run and agentctl differentials below carry the gate-exclusive
  # label: when opted in, scripts/validate.py runs them after the main phase,
  # one at a time under one fresh gate.py --exclusive admission per gate.
  # They assert exact outcomes of small wall clocks inside agentctl (Herdr
  # probes against a Python fake Herdr — one fresh interpreter per call —
  # judged against harness budgets as small as 50 ms, beside the tools' own
  # 5 s / 10 s git check-ignore bounds), so under shared-gate contention the
  # two editions classify the same pane differently and the step goes red
  # while passing every exclusive rerun
  # (#725 validate-speed). #1067 cross-differential-load-aware makes those
  # comparisons load-aware; a host opts the kept steps into the main phase
  # with AGENT_UTILS_CROSS_IN_MAIN_PHASE=1 (see partition_gate_exclusive in
  # scripts/validate.py) only after its own paired timing record passes.
  # Unset keeps the exclusive phase, so the load-aware change is safe to
  # land on its own. The label stays in both positions — it marks the
  # partition, not the selection. They deliberately do NOT carry the
  # validation-cross label: they are selected only when their own component
  # is selected (validation/components.json names the paths that can change
  # each tool, harness files included), when the cross group was triggered
  # from outside cross/ by shared inputs, or under --all / the
  # unclassified-path fail-safe — never merely because another tool's
  # cross files changed.
  - group: herdr-run
    job: differential
    desc: herdr-run Python and Rust commands agree
    cmd: python3 cross/differential.py --tool herdr-run
    jobs_flag: ""
    labels: [component-herdr-run, gate-exclusive]
    timeout: 9600
    cpu_timeout: 1200
    hint: *cross_hint

  - group: agentctl
    job: herdr-agent-differential
    desc: herdr-agent Python and Rust commands agree
    cmd: python3 cross/differential.py --tool herdr-agent
    jobs_flag: ""
    labels: [component-agentctl, gate-exclusive]
    timeout: 9600
    cpu_timeout: 1200
    hint: *cross_hint

  - group: agentctl
    job: differential-0
    desc: agentctl Python and Rust commands agree (group shard 1 of 3)
    cmd: python3 cross/differential.py --tool agentctl --shard 0/3
    jobs_flag: ""
    labels: [component-agentctl, gate-exclusive]
    # Sharded by group (see cross/agentctl_differential.py shard_groups):
    # one 1200 s serial node timed out under multi-gate load; three shorter
    # nodes keep each wall well inside the same budget without raising it.
    timeout: 19200
    cpu_timeout: 2400
    hint:
      est_duration_s: 120
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 2684354560

  - group: agentctl
    job: differential-1
    desc: agentctl Python and Rust commands agree (group shard 2 of 3)
    cmd: python3 cross/differential.py --tool agentctl --shard 1/3
    jobs_flag: ""
    labels: [component-agentctl, gate-exclusive]
    timeout: 19200
    cpu_timeout: 2400
    hint:
      est_duration_s: 120
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 2684354560

  - group: agentctl
    job: differential-2
    desc: agentctl Python and Rust commands agree (group shard 3 of 3)
    cmd: python3 cross/differential.py --tool agentctl --shard 2/3
    jobs_flag: ""
    labels: [component-agentctl, gate-exclusive]
    timeout: 19200
    cpu_timeout: 2400
    hint:
      est_duration_s: 120
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 2684354560
