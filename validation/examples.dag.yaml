description: Shipped DAG examples under both implementations

steps:
  - group: run
    job: python
    desc: every shipped example runs under Python dagrun
    cmd: python3 scripts/check_dagrun_examples.py --engine python
    jobs_flag: ""
    labels: [validation-cross, component-dagrun]
    delegated_children: true
    timeout: 600
    cpu_timeout: 900
    hint: &examples_hint
      est_duration_s: 30
      classification: latency-bound
      # Example 05 deliberately proves a fixed-width inner job is refused below eight CPUs.
      # The delegated outer envelope must make that advertised width physically available.
      preferred_inner_jobs: 8
      rss_baseline_bytes: 1073741824
      # Example 08 explicitly models a 16 GiB clean-build worker. The parent must delegate that
      # advertised envelope rather than letting an inner scheduler plan against memory it cannot
      # physically use. An explicit hard cap avoids multiplying this contract by 1.25.
      hard_mem_max_bytes: 17179869184

  - group: run
    job: rust
    desc: every shipped example runs under Rust dagrun
    cmd: python3 scripts/check_dagrun_examples.py --engine rust
    jobs_flag: ""
    labels: [validation-cross, component-dagrun]
    delegated_children: true
    timeout: 600
    cpu_timeout: 900
    hint: *examples_hint
