description: Browser-functional and interaction-budget checks for the timeline viewer

resource_caps:
  browser: 1

steps:
  - group: browser
    job: functional
    desc: drive timeline interactions in Chromium
    # This graph already supplies containment. Calling the tool Makefile here would start a
    # second dagrun `box`, which the scheduler correctly refuses as an unflattened nested run.
    cmd: >-
      cd py/tests/js/browser &&
      ../../../../scripts/with-node22 npx playwright test --reporter=line
    jobs_flag: ""
    labels: [validation-timeline, component-wrkviz]
    timeout: 600
    cpu_timeout: 900
    hint:
      resources: {browser: 1}
      est_duration_s: 45
      classification: latency-bound
      preferred_inner_jobs: 2
      rss_baseline_bytes: 1073741824

  - group: browser
    job: benchmark-instrument
    desc: prove the real-site benchmark records every advertised metric
    cmd: >-
      cd py/tests/js/browser &&
      ../../../../scripts/with-node22 node --test benchmark-site.test.cjs
    jobs_flag: ""
    labels: [validation-timeline, component-wrkviz]
    timeout: 600
    cpu_timeout: 900
    hint:
      resources: {browser: 1}
      est_duration_s: 15
      classification: latency-bound
      preferred_inner_jobs: 2
      rss_baseline_bytes: 1073741824

  - group: browser
    job: benchmark
    desc: enforce timeline pan and zoom redraw budgets
    cmd: >-
      cd py/tests/js/browser &&
      ../../../../scripts/with-node22 node --test benchmark-budget.test.cjs &&
      printf '\n' && cat benchmark-report.txt
    jobs_flag: ""
    labels: [validation-timeline, component-wrkviz]
    timeout: 600
    cpu_timeout: 900
    hint:
      resources: {browser: 1}
      est_duration_s: 15
      classification: latency-bound
      preferred_inner_jobs: 2
      rss_baseline_bytes: 1073741824
