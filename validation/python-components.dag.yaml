  # Four shards, balanced by recorded family durations (`scripts/pytest_shard_weights.json`,
  # regenerated with `scripts/case_timings.py weights`): on 2026-10-30 the count-balanced
  # halves measured 836 s and 993 s solo (1,827.5 recorded seconds over 815 families), past
  # the old 600 s bound, while duration-weighted quarters measured 447-554 s solo on the
  # landing tree and 830-898 s inside a full gate (four shards and the lifecycle shards
  # now contend for the same host). The 1500 s cap keeps clear headroom over both.
  # #696 wrkslots-shard-timeout.
