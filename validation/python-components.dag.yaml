    labels: [validation-python, validation-python-component-tests, component-repository-infrastructure]
    timeout: 60
    cpu_timeout: 60
    hint:
      est_duration_s: 1
      classification: light
      preferred_inner_jobs: 1
      # A full-load run reached the prior 160 MiB learned cap and recorded three OOM kills.
      # Keep an authored 256 MiB floor so the normal runtime margin supplies 320 MiB.
      rss_baseline_bytes: 268435456

