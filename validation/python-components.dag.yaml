# Python tests are owned by tool, not by one monolithic workspace lane. This is both a useful
# execution shape and the selection boundary: a change to tick-hub can run tick-hub's tests without
# paying for agentctl, wrkviz, or dagrun. `run_component_tests.py --self-test` fails if a new test
# file is unowned or multiply owned.

description: Tool-owned Python regression suites

resource_caps:
  # Shared with the lifecycle fragment when both are included in the repository graph; see the
  # measurements there.
  lifecycle-io: 13

steps:
  # #2306: py/tests/rust_binary.py release-builds agentctl (and the fake chat plugin) for the
  # shards' Rust differential cases. Built inside a shard, that one rustc for the agentctl crate
  # peaked at 2.69 GiB RSS (cgroup peak 3.02 GiB, cold target, main abd810bd, 2026-11-26), above
  # the shard's 2.5 GiB cap, so both shards were OOM-killed at their first Rust case from
  # 2026-11-20 on. This step builds the same target with the same command first; each shard's
  # own Cargo call then only checks freshness, and the shard caps measure the Python tests alone.
  # Peak 3.02 GiB + max(25%, 512 MiB) (#818's rule) = 3.78 GiB; the 4 GiB baseline x 1.25 caps
  # it at 5 GiB, leaving room for the crate's growth (about 11% in lines over the last week).
