  # Sixteen shards (was eight), balanced by recorded family durations
  # (`scripts/pytest_shard_weights.json`, regenerated with `scripts/case_timings.py weights`):
  # on 2026-11-18 a shard died at its 2400 CPU-s cap at ~48% with no failing test, on this
  # loaded host and in two other lanes' gates the same day; solo timings of the heavy
  # families (the retire lsof census ~126 s, worktrees-image and Rust-differential suites
  # >300 s each) sum past the cap once gate parallelism contends for the same cores.
  # Sixteen shards halve the per-shard CPU so the step stays robust on a hot host
  # (owner rule 346). The 2400 s cap per shard is unchanged headroom, not a budget raise.
  # #696 wrkslots-shard-timeout.
  # #2318: py/wrkslots/tests/rust_binary.py release-builds wrkslotsd for the shards' Rust
  # differential cases, which the family weighting spreads over every shard, so whichever
  # shard reached one first ran that compile inside its own memory cap (shards peaked at
  # 94-99% of their 1.88 GiB cap from 2026-11-20 on). This step builds the same target with
  # the same command first, as python.agentctl.build-rust does for agentctl (#2306); each
  # shard's own Cargo call then only checks freshness.
  # Cold measurement on 2026-11-26 (load1 186-199, two Cargo jobs): 161 s, 282 CPU-s, cgroup
  # peak 1.43 GiB, of which the wrkslotsd rustc alone was 1.34 GiB. By #818's rule that needs
