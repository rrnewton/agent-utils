      cd py &&
      python3 -m pr_landing_planner --version &&
      python3 -m pr_landing_planner plan
      --fixture pr_landing_planner/examples/pr-landing-demo.yaml
      --flaky-signatures pr_landing_planner/examples/flaky-signatures.yaml --format human
