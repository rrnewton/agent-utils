    job: build-rust
    desc: agentctl Rust adapter executables the agentctl Python shards compare against
    cmd: python3 py/tests/rust_binary.py
    jobs_flag: ""
    labels: [validation-workspace, validation-python-component-tests, component-agentctl]
    timeout: 14400
    cpu_timeout: 3600
    hint:
