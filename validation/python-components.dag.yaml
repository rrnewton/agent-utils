# Python tests are owned by tool, not by one monolithic workspace lane. This is both a useful
# execution shape and the selection boundary: a change to tick-hub can run tick-hub's tests without
# paying for agentctl, wrkviz, or dagrun. `run_component_tests.py --self-test` fails if a new test
# file is unowned or multiply owned.

description: Tool-owned Python regression suites

resource_caps:
  # Shared with the lifecycle fragment when both are included in the repository graph; see the
  # measurements there.
  lifecycle-io: 13

steps:
  - group: agentctl
    job: shard-0
    desc: agentctl Python tests, shard 1 of 2
    cmd: python3 scripts/run_component_tests.py --component agentctl --shard 0/2 -- -q
    jobs_flag: ""
    labels: [validation-workspace, validation-python-component-tests, validation-pytest-shards, component-agentctl]
    timeout: 900
    cpu_timeout: 1800
    hint: &python_test_hint
      est_duration_s: 150
      classification: latency-bound
      preferred_inner_jobs: 2
      rss_baseline_bytes: 1610612736

  - group: agentctl
    job: shard-1
    desc: agentctl Python tests, shard 2 of 2
    cmd: python3 scripts/run_component_tests.py --component agentctl --shard 1/2 -- -q
    jobs_flag: ""
    labels: [validation-workspace, validation-python-component-tests, validation-pytest-shards, component-agentctl]
    timeout: 900
    cpu_timeout: 1800
    hint: *python_test_hint

  - group: dagrun
    job: shard-0
    desc: dagrun Python tests, shard 1 of 2
    cmd: python3 scripts/run_component_tests.py --component dagrun --shard 0/2 -- -q {args}
    jobs_flag: ""
    labels: [validation-workspace, validation-python-component-tests, validation-pytest-shards, component-dagrun]
    delegated_children: true
    timeout: 900
    cpu_timeout: 1800
    hint:
      est_duration_s: 150
      classification: latency-bound
      preferred_inner_jobs: 2
      rss_baseline_bytes: 1610612736
      hard_mem_max_bytes: 2147483648

  - group: dagrun
    job: shard-1
    desc: dagrun Python tests, shard 2 of 2
    cmd: python3 scripts/run_component_tests.py --component dagrun --shard 1/2 -- -q {args}
    jobs_flag: ""
    labels: [validation-workspace, validation-python-component-tests, validation-pytest-shards, component-dagrun]
    delegated_children: true
    timeout: 900
    cpu_timeout: 1800
    hint:
      est_duration_s: 150
      classification: latency-bound
      preferred_inner_jobs: 2
      rss_baseline_bytes: 1610612736
      hard_mem_max_bytes: 2147483648

  - group: experiment-runner
