  - group: experiment-runner
    job: cli-smoke
    desc: experiment runner version, guide, and dry planning scenarios
    cmd: >-
      cd py &&
      python3 -m parallel_experiment_runner --version &&
      python3 -m parallel_experiment_runner quickstart >/dev/null &&
      python3 -m parallel_experiment_runner plan-round --name smoke --seeds 0-3
      --cpu-cores 1 --memory 1G --max-concurrency 2 -- /bin/true {seed}
    jobs_flag: ""
    labels: [validation-workspace, component-experiment-runner]
    timeout: 120
    cpu_timeout: 120
    hint:
      est_duration_s: 3
