# Draft dev-hermit instantiation of local-ci-hub (phase 3, NOT applied).
# The coordinator places this at the dev-hermit root as local-ci-hub.toml.
# Policy note (DESIGN.md section 10.2): the landing path must read the
# qualification policy from the target branch's committed copy of this
# file, never from a candidate checkout's copy.

[project]
name = "dev-hermit"
repos = [
  { id = "product", remote = "owner/product", default_branch = "main" },
  { id = "parent", remote = "owner/parent", default_branch = "main" },
]

[validate]
# The project's own validation entry point; local-ci-hub does not
# interpret it. Admission and run handles stay with the existing
# engine during the port (shadow mode reads only).
command = ["scripts/validate.rs"]
cells = []
admission_slots = 6

[ledger]
# Existing published ledger, adopted as-is. No format change.
team = "hermit"
publish = "git"
location = { path = "ledger/hermit" }

[remote]
provider = "github"
workflows = []

[receipt]
# At least as strict as today's canonical predicate: a local PASS
# row must also carry executed tests, commit anchoring, and a
# valid digest where present (enforced in receipt.py).
qualifying = ["local-ledger-pass"]

[receipt.release_payload]
path = "target/validate/hermit"
profile = "validate"
debug_assertions = true
overflow_checks = true

[health]
probes = []
