name: repository-ci

# Authoritative repository gate. Run for every change so edits to the Makefile,
# setup driver, workflows, or a new utility cannot bypass the repository's own
# build/test contract. The focused workflows remain useful diagnostics.
#
# GitHub path filters are deliberately absent. The repository selector understands distinctions
# that workflow globs cannot express safely -- for example, prose under `ai_docs/` selects only
# hygiene while a Python audit helper there also selects strict typing. Every event therefore asks
# the canonical selector for its plan instead of maintaining a second, coarser skip policy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep checkout's temporary `git init` deterministic and quiet. Without this,
# Git emits a default-branch warning before the repository config exists.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      validate_args: ${{ steps.select.outputs.validate_args }}
      browser: ${{ steps.select.outputs.browser }}
      python: ${{ steps.select.outputs.python }}
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: install the canonical DAG loader dependency
        run: python -m pip install pyyaml
      - name: classify the change with the repository selector
        id: select
        env:
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            args="--base $PULL_BASE"
          elif [[ "$GITHUB_EVENT_NAME" == push && -n "$PUSH_BASE" && ! "$PUSH_BASE" =~ ^0+$ ]]; then
            args="--base $PUSH_BASE"
          else
            args="--all"
          fi
          echo "validate_args=$args" >> "$GITHUB_OUTPUT"
          python3 scripts/validate.py $args --list > /tmp/validation-plan.txt
          cat /tmp/validation-plan.txt
          for group in browser python rust; do
            selected=false
            case "$group" in
              browser) pattern='NEED +resource:browser' ;;
              python) pattern='RUN +(python|workspace)' ;;
              rust) pattern='RUN +(rust|workspace)' ;;
            esac
            if [[ "$args" == --all ]] || grep -Eq "$pattern" /tmp/validation-plan.txt; then
              selected=true
            fi
            echo "$group=$selected" >> "$GITHUB_OUTPUT"
          done

  rust-msrv:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: check the declared Rust 1.85 MSRV
        # `--all-targets` compiles the tests as well as libraries and binaries. Runtime regressions
        # belong to the selected stable-toolchain graph; rerunning every test and package smoke on
        # the older compiler spent minutes without increasing the compatibility surface.
        run: cargo check --locked --workspace --all-targets --manifest-path rs/Cargo.toml

  validate:
    # The same selector and the same flattened graph as `make validate` locally. Compatibility
    # jobs below use older language versions; they are not a second definition of this contract.
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Selection compares the checked-out commit with the event's real base. A depth-one
          # checkout cannot answer that question and must not silently become a full run.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install validation dependencies
        # PyYAML is a workspace runtime dep; Playwright and websockets are optional vibe-talk
        # runtime deps. All three must be installed for the repository-wide strict mypy gate.
        run: python -m pip install --upgrade 'setuptools>=77' mypy 'playwright==1.61.0' pytest pyyaml types-PyYAML 'websockets>=12'
      - name: install Chromium only when the selected graph needs it
        if: needs.plan.outputs.browser == 'true'
        working-directory: py/tests/js/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: run the selected flattened validation graph
        env:
          # Hosted runners do not consistently delegate cgroup v2. Wall limits and the runner's
          # own container remain active; dagrun reports the degraded capability explicitly.
          BOX_FLAGS: --allow-cgroup-failure
          VALIDATE_ARGS: ${{ needs.plan.outputs.validate_args }}
        run: python3 scripts/validate.py $VALIDATE_ARGS
      - name: keep selected browser benchmark measurements
        if: always() && needs.plan.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: timeline-redraw-benchmark-${{ github.sha }}
          path: |
            py/tests/js/browser/benchmark-report.txt
            py/tests/js/browser/test-results/
          if-no-files-found: ignore
          retention-days: 90

  python-minimum:
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: install minimum-runtime test tooling
        run: python -m pip install --upgrade 'setuptools>=77' pyyaml
      - name: parse every Python module on the declared minimum
        run: python -m compileall -q py
      - name: dependency-free startup contract
        run: make check-deps
      - name: wheel and sdist contract on declared minimum Python
        # Runtime regression belongs to the selected 3.12 DAG. Parsing all modules plus building
        # and executing every installable artifact retains the 3.10 compatibility signal without
        # serially repeating the formerly 46-minute Python test contract.
        run: make check-python-packages
