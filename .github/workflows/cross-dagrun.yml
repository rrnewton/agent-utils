name: repository-ci

# Authoritative repository gate. Run for every change so edits to the Makefile,
# setup driver, workflows, or a new utility cannot bypass the repository's own
# build/test contract. The focused workflows remain useful diagnostics.
#
# GitHub path filters are deliberately absent. The repository selector understands distinctions
# that workflow globs cannot express safely -- for example, prose under `ai_docs/` selects only
# hygiene while a Python audit helper there also selects strict typing. Every event therefore asks
# the canonical selector for its plan instead of maintaining a second, coarser skip policy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep checkout's temporary `git init` deterministic and quiet. Without this,
# Git emits a default-branch warning before the repository config exists.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      validate_args: ${{ steps.select.outputs.validate_args }}
      browser: ${{ steps.select.outputs.browser }}
      python: ${{ steps.select.outputs.python }}
      rust: ${{ steps.select.outputs.rust }}
      contract: ${{ steps.select.outputs.contract }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: install the canonical DAG loader dependency
        run: python -m pip install pyyaml
      - name: classify the change with the repository selector
        id: select
        env:
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            args="--base $PULL_BASE"
          elif [[ "$GITHUB_EVENT_NAME" == push && -n "$PUSH_BASE" && ! "$PUSH_BASE" =~ ^0+$ ]]; then
            args="--base $PUSH_BASE"
          else
            args="--all"
          fi
          echo "validate_args=$args" >> "$GITHUB_OUTPUT"
          python3 scripts/validate.py $args --list > /tmp/validation-plan.txt
          cat /tmp/validation-plan.txt
          for group in browser python rust contract; do
            selected=false
            case "$group" in
              browser) pattern='NEED +resource:browser' ;;
              python) pattern='RUN +(python|workspace)' ;;
              rust) pattern='RUN +(rust|workspace)' ;;
              contract) pattern='STEP +vibe-talk\.check\.contract$' ;;
            esac
            if [[ "$args" == --all ]] || grep -Eq "$pattern" /tmp/validation-plan.txt; then
              selected=true
            fi
            echo "$group=$selected" >> "$GITHUB_OUTPUT"
          done

  rust-msrv:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # With its test step (30 runs, 2026-09-21..25) this job took 2.9-25.1 min in its 21 green
    # runs, median 6.8; the longest of 9 red runs took 30.0. 45 bounds a hang, not a slow build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # Several Rust interoperability tests execute the real Python recovery fixtures.  They
      # import pytest even though this job's primary toolchain is Rust, so install that explicit
      # test dependency instead of depending on the runner image's ambient Python packages.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: install Python fixture dependencies
        run: python -m pip install pytest
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: check the declared Rust 1.85 MSRV
        run: cargo check --locked --workspace --all-targets --manifest-path rs/Cargo.toml
      # rs/Cargo.toml declares rust-version 1.85. Compiling the tests on it does not show that they
      # pass on it: the selected graph runs them only on the stable toolchain. --no-fail-fast, so
      # the first failing test binary does not hide the others.
      - name: test all targets on the declared MSRV
        id: msrv-tests
        run: cargo test --locked --no-fail-fast --workspace --all-targets --manifest-path rs/Cargo.toml
      - name: verify registry artifacts on the declared MSRV
        # Also runs when only the test step failed, so a test failure does not hide this result.
        if: ${{ !cancelled() && (success() || steps.msrv-tests.outcome == 'failure') }}
        run: python3 scripts/check_rust_packages.py

  validate:
    # The same selector and the same flattened graph as `make validate` locally. Compatibility
    # jobs below use older language versions; they are not a second definition of this contract.
    needs: plan
    runs-on: ubuntu-latest
    # The nightly's budget. A workflow edit selects the complete graph, and the graph now keeps
    # going past a failure (validate.py --keep-going), so a red run lasts as long as a green one;
    # the complete graph alone has taken about fifty minutes on a hosted runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # Selection compares the checked-out commit with the event's real base. A depth-one
          # checkout cannot answer that question and must not silently become a full run.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install validation dependencies
        # PyYAML is a workspace runtime dep; Playwright and websockets are optional vibe-talk
        # runtime deps. All three must be installed for the repository-wide strict mypy gate.
        run: python -m pip install --upgrade 'setuptools>=77' mypy 'playwright==1.61.0' pytest pyyaml types-PyYAML 'websockets>=12'
      # vibe-talk's generated wire contract is checked for staleness and voice.js is type-checked
      # against it, both with the generator's pinned, lockfile-installed tools (Ajv, TypeScript).
      - name: install the vibe-talk contract tools
        if: needs.plan.outputs.contract == 'true'
        run: npm ci --prefix vibe-talk/contract --no-audit --no-fund
      - name: install Chromium only when the selected graph needs it
        if: needs.plan.outputs.browser == 'true'
        working-directory: py/tests/js/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: run the selected flattened validation graph
        env:
          # Hosted runners do not consistently delegate cgroup v2. Wall limits and the runner's
          # own container remain active; dagrun reports the degraded capability explicitly.
          BOX_FLAGS: --allow-cgroup-failure
          # The same degradation makes this lane PARTIAL for cross/differential.py's boxing
          # checks. They are listed as SKIPPED/UNVERIFIED, never counted as passes, and the run
          # ends with PARTIAL rather than OK. The step still passes, so validate.py also emits a
          # warning annotation and a job-summary entry for PARTIAL. Boxing coverage comes from
          # local boxed validation.
          # Hosted runners also have fewer than eight CPUs, so the CPA planner's memory-cap check
          # (which needs a core budget of eight) is skipped as eight-cpu and is covered locally.
          AGENT_UTILS_CROSS_ALLOW_SKIP: boxing,eight-cpu
          VALIDATE_ARGS: ${{ needs.plan.outputs.validate_args }}
        # --keep-going: one failed step no longer aborts the independent ones, so a run names
        # every failure instead of the first and "N not launched". Steps that depend on a failed
        # step are still skipped.
        run: python3 scripts/validate.py --keep-going $VALIDATE_ARGS
      - name: keep selected browser benchmark measurements
        if: always() && needs.plan.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: timeline-redraw-benchmark-${{ github.sha }}
          path: |
            py/tests/js/browser/benchmark-report.txt
            py/tests/js/browser/test-results/
          if-no-files-found: ignore
          retention-days: 90

  python-minimum:
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    # Parsing, startup and packaging on the declared minimum; the tests are python-minimum-tests.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: install minimum-runtime test tooling
        run: python -m pip install --upgrade 'setuptools>=77' pytest pyyaml
      - name: parse every Python module on the declared minimum
        run: python -m compileall -q py
      - name: dependency-free startup contract
        run: make check-deps
      - name: wheel and sdist contract on declared minimum Python
        run: make check-python-packages

  python-minimum-tests:
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    # Every distribution declares requires-python >=3.10, and the selected graph runs the tests
    # only on 3.12. Run serially, the whole suite outgrew its 35 minutes by 2026-10-10 and was
    # cancelled at about 92% in every run after that, so nothing said which tests fail here.
    #
    # Six family-preserving shards, partitioned by scripts/run_pytest_shard.py, the graph's own
    # sharder. This lane differs from the graph on purpose: it re-runs the whole pytest tree on
    # the minimum interpreter, bare, one process per shard, without the graph's namespace wrapper
    # and markers for the lifecycle suite. A test that fails here and also fails when run the
    # same way on 3.12 is environmental, not a 3.10 defect.
    #
    # fail-fast is off, so one red shard cannot cancel the others' reports. Each shard names a
    # failing test the moment it fails (the component-test plugin), and its test step's own limit
    # sits below the job's, so a slow shard still reaches the summary and upload steps.
    #
    # Tests that fail on 3.10 are tracked by minibeads issue #367 python-minimum-failures: until
    # it is closed a red shard is expected, and a failure it does not list is a new regression.
    # Not skipped, and not marked continue-on-error. `#361 python-minimum-timeout`.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: install minimum-runtime test tooling
        run: python -m pip install --upgrade 'setuptools>=77' pytest pyyaml
      - name: tests on declared minimum Python, shard ${{ matrix.shard }} of 6
        working-directory: py
        timeout-minutes: 22
        # bash, so pipefail holds: the step fails when pytest does, while tee keeps the log for
        # the summary step even if this step is stopped at its limit before pytest's report.
        shell: bash
        run: |
          set -o pipefail
          python ../scripts/run_pytest_shard.py --shard ${{ matrix.shard }}/6 -- \
            -q -p run_component_tests --durations=20 \
            --junitxml="$RUNNER_TEMP/py310-shard.xml" 2>&1 | tee "$RUNNER_TEMP/py310-shard.log"
      - name: name this shard's failures in the job summary
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - "$RUNNER_TEMP/py310-shard.xml" "$RUNNER_TEMP/py310-shard.log" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET

          report, log, shard = sys.argv[1], sys.argv[2], os.environ["SHARD"]
          failed = None
          if os.path.exists(report):
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  root = None  # a shard killed mid-write: fall through to the log
              if root is not None:
                  source = "JUnit report"
                  failed = []
                  for case in root.iter("testcase"):
                      if case.find("failure") is None and case.find("error") is None:
                          continue
                      properties = {p.get("name"): p.get("value") for p in case.iter("property")}
                      failed.append(
                          properties.get("nodeid") or f"{case.get('classname')}::{case.get('name')}"
                      )
          if failed is None and os.path.exists(log):
              source = "log only: the shard stopped before pytest wrote its report"
              prefix = "component-tests: FAILED "
              with open(log, encoding="utf-8", errors="replace") as lines:
                  failed = [line[len(prefix):].strip() for line in lines if line.startswith(prefix)]
          if failed is None:
              source = "no report and no log: the shard never started its tests"
              failed = []
          failed = list(dict.fromkeys(failed))
          print(f"### Python 3.10 shard {shard}: {len(failed)} failed ({source})")
          print("".join(f"- `{nodeid}`\n" for nodeid in failed))
          EOF
      - name: keep this shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: py310-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/py310-shard.xml
            ${{ runner.temp }}/py310-shard.log
          if-no-files-found: ignore
          retention-days: 30
