name: py-safe-ci-dag-runner

# Only run when the Python side of this tool (or its shared docs) changes.
on:
  push:
    branches: [main]
    paths:
      - 'py/pyproject.toml'
      - 'py/safe_ci_dag_runner/**'
      - 'py/tests/**'
      - 'common/docs/safe-ci-dag-runner/**'
      - '.github/workflows/py-safe-ci-dag-runner.yml'
  pull_request:
    paths:
      - 'py/pyproject.toml'
      - 'py/safe_ci_dag_runner/**'
      - 'py/tests/**'
      - 'common/docs/safe-ci-dag-runner/**'
      - '.github/workflows/py-safe-ci-dag-runner.yml'

jobs:
  py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install --upgrade mypy pytest
      - name: mypy (strict, no explicit Any)
        run: python -m mypy .
      - name: pytest
        run: python -m pytest -q
      - name: smoke --version
        run: python -m safe_ci_dag_runner --version
