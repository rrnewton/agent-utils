name: py-main-write

# The single-writer publication guard. The unit suite runs on change; the
# PR-exception invariant is also polled on a schedule, because a violation is
# created by opening a PR rather than by pushing a commit, so a change-triggered
# run alone would never observe it.
#
# ADVISORY, NOT A GATE. `main` deliberately carries no `required_status_checks`
# rule (that would block the direct-to-main workflow this repository is built
# around), so a red run here does not and cannot block a push. It is a signal
# for a human or the coordinator, not an authority.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/main_write.py'
      - '.githooks/pre-push'
      - 'py/tests/test_main_write.py'
      - '.github/workflows/py-main-write.yml'
  pull_request:
    paths:
      - 'scripts/main_write.py'
      - '.githooks/pre-push'
      - 'py/tests/test_main_write.py'
      - '.github/workflows/py-main-write.yml'
  schedule:
    # Daily, to observe PR-exception drift that no code change would trigger.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install --upgrade mypy pytest
      - name: mypy (strict, no explicit Any)
        run: python -m mypy --config-file py/pyproject.toml --strict --disallow-any-explicit --disallow-any-decorated scripts/main_write.py
      - name: no typing.Any
        run: python3 scripts/check_no_any.py scripts/main_write.py
      - name: pytest (both brackets — refuses violations, permits legitimate work)
        working-directory: py
        run: python -m pytest -q tests/test_main_write.py
      - name: The tracked hook matches what install-hooks writes
        # A drifted checked-in hook would silently stop enforcing while still
        # looking installed.
        run: python3 scripts/main_write.py install-hooks --check

  pr-exceptions:
    # Separated so a PR-hygiene violation is legible on its own rather than
    # being read as the guard itself failing.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: At most one open PR, each recording an exact Exception-Reason
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_UTILS_MAIN_WRITE_NO_PROXY: '1'
        run: python3 scripts/main_write.py pr-exceptions --repository ${{ github.repository }} --json
