name: cross-safe-ci-dag-runner

# Run when EITHER implementation of this tool (or the cross harness) changes:
# builds both and asserts identical observable behavior.
on:
  push:
    branches: [main]
    paths:
      - 'py/pyproject.toml'
      - 'py/safe_ci_dag_runner/**'
      - 'rs/Cargo.toml'
      - 'rs/Cargo.lock'
      - 'rs/safe-ci-dag-runner/**'
      - 'cross/**'
      - 'examples/**'
      - 'common/docs/**'
      - 'scripts/embed_userguides.py'
      - '.github/workflows/cross-safe-ci-dag-runner.yml'
  pull_request:
    paths:
      - 'py/pyproject.toml'
      - 'py/safe_ci_dag_runner/**'
      - 'rs/Cargo.toml'
      - 'rs/Cargo.lock'
      - 'rs/safe-ci-dag-runner/**'
      - 'cross/**'
      - 'examples/**'
      - 'common/docs/**'
      - 'scripts/embed_userguides.py'
      - '.github/workflows/cross-safe-ci-dag-runner.yml'

jobs:
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: install python deps
        # pyyaml is a runtime dep of the Python CLI (which the differential invokes to load the
        # YAML fixtures); mypy is for the harness typecheck below.
        run: python -m pip install --upgrade mypy pyyaml
      - name: embedded user guides in sync with their single source
        # No Silent Failure: fail loudly if common/docs/<tool>/USER_GUIDE.md was edited without
        # regenerating the committed embedded copies (py package resource + rs include_str! target).
        run: python scripts/embed_userguides.py --check
      - name: build rust
        run: cargo build --release --workspace --manifest-path rs/Cargo.toml
      - name: mypy the differential harness
        run: python -m mypy cross/differential.py
      - name: differential (py vs rs, incl. YAML isomorphism)
        run: python cross/differential.py --tool safe-ci-dag-runner
