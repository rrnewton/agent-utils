name: py-tick-hub

# Only run when the Python side of this tool (its package, tests, examples, or shared docs) changes.
on:
  push:
    branches: [main]
    paths:
      - 'py/pyproject.toml'
      - 'py/tick_hub/**'
      - 'py/tests/test_tickhub_*.py'
      - 'examples/tick-hub-*'
      - 'common/docs/tick-hub/**'
      - '.github/workflows/py-tick-hub.yml'
  pull_request:
    paths:
      - 'py/pyproject.toml'
      - 'py/tick_hub/**'
      - 'py/tests/test_tickhub_*.py'
      - 'examples/tick-hub-*'
      - 'common/docs/tick-hub/**'
      - '.github/workflows/py-tick-hub.yml'

jobs:
  py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        # pyyaml is a runtime dep (YAML interchange); types-PyYAML supplies the stubs mypy --strict
        # needs (PyYAML ships none).
        run: python -m pip install --upgrade mypy pytest pyyaml types-PyYAML
      - name: mypy (strict, no explicit Any)
        run: python -m mypy .
      - name: pytest (tick-hub)
        run: python -m pytest -q tests/test_tickhub_*.py
      - name: smoke --version
        run: python -m tick_hub --version
      - name: smoke example tick (dry-run)
        run: python -m tick_hub tick --config ../examples/tick-hub-ops.yaml --state ../examples/tick-hub-state.yaml --now 0 --no-header
