name: examples-dagrun

# Prove every shipped example DAG still runs green under BOTH builds. Runs when the examples
# change, or when either implementation that executes them changes (so a source regression that
# breaks a newcomer example is caught here too).
on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'py/pyproject.toml'
      - 'py/dagrun/**'
      - 'rs/Cargo.toml'
      - 'rs/Cargo.lock'
      - 'rs/dagrun/**'
      - '.github/workflows/examples-dagrun.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'py/pyproject.toml'
      - 'py/dagrun/**'
      - 'rs/Cargo.toml'
      - 'rs/Cargo.lock'
      - 'rs/dagrun/**'
      - '.github/workflows/examples-dagrun.yml'

jobs:
  examples:
    runs-on: ubuntu-latest
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: install python deps
        # pyyaml is a runtime dep: the CLI imports it to load the .yaml examples.
        run: python -m pip install --upgrade pyyaml
      - name: build rust
        run: cargo build --release --workspace --manifest-path rs/Cargo.toml
      - name: run every example under the Python build
        env:
          PYTHONPATH: py
        run: |
          shopt -s nullglob
          examples=(examples/*.json examples/*.yaml)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "no examples/*.json or examples/*.yaml found" >&2
            exit 1
          fi
          for dag in "${examples[@]}"; do
            echo "::group::python run $dag"
            # Cgroup boxing is ON by default; CI runners lack a systemd --user scope, so opt out
            # (a bare `run` would exit 3). This mirrors how the docs tell newcomers to run anywhere.
            # --no-profile keeps each example from writing a default profile store here (the store
            # itself is exercised by the dedicated step below).
            extra=()
            if [ "$dag" = examples/05-inner-jobs.json ]; then
              # This example intentionally declares a fixed, self-managed width of eight. Its
              # documented successful invocation therefore supplies that per-step ceiling.
              extra+=(--max-cpus 8)
            fi
            python3 -m dagrun run --dag "$dag" --allow-cgroup-failure --no-profile "${extra[@]}"
            echo "::endgroup::"
          done
      - name: run every example under the Rust build
        run: |
          shopt -s nullglob
          examples=(examples/*.json examples/*.yaml)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "no examples/*.json or examples/*.yaml found" >&2
            exit 1
          fi
          for dag in "${examples[@]}"; do
            echo "::group::rust run $dag"
            # Cgroup boxing is ON by default; CI runners lack a systemd --user scope, so opt out
            # (a bare `run` would exit 3). This mirrors how the docs tell newcomers to run anywhere.
            extra=()
            if [ "$dag" = examples/05-inner-jobs.json ]; then
              # Mirror the Python invocation and the example's documented fixed-width contract.
              extra+=(--max-cpus 8)
            fi
            rs/target/release/dagrun run --dag "$dag" --allow-cgroup-failure --no-profile "${extra[@]}"
            echo "::endgroup::"
          done
      - name: exercise --selected, --profile, sweep, and the default profile store (both builds)
        env:
          PYTHONPATH: py
        run: |
          set -euo pipefail
          ex=examples/06-step-sweep.json
          # Both builds share the same CLI, so run the identical checks against each.
          for build in "python3 -m dagrun" "rs/target/release/dagrun"; do
            echo "::group::$build run --selected (selected leaf plus dependency ancestry)"
            $build run --dag "$ex" --selected package.tarball --allow-cgroup-failure --no-profile
            echo "::endgroup::"

            echo "::group::$build run --selected --ignore-selected-deps (named step only)"
            $build run --dag "$ex" --selected test.unit --ignore-selected-deps \
              --allow-cgroup-failure --no-profile
            echo "::endgroup::"

            echo "::group::$build run --selected unknown tag must exit 2"
            rc=0
            $build run --dag "$ex" --selected no.pe --allow-cgroup-failure --no-profile || rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "expected exit code 2 for an unknown --selected tag, got $rc" >&2; exit 1
            fi
            echo "::endgroup::"

            echo "::group::$build run --profile (Feature C: per-step timing/memory table)"
            # The table goes to stdout; capture it and assert the header + a real step row appear.
            table="$($build run --dag "$ex" --selected build.app --profile \
              --allow-cgroup-failure --no-profile)"
            echo "$table"
            echo "$table" | grep -q 'per-step profile:' \
              || { echo "run --profile printed no profile table" >&2; exit 1; }
            echo "$table" | grep -Eq '^build\.app' \
              || { echo "run --profile table missing the build.app step row" >&2; exit 1; }
            echo "::endgroup::"

            echo "::group::$build sweep (Feature B) -> default profile store (Feature D)"
            rm -rf .dagrun
            $build sweep --dag "$ex" --step build.app --jobs 1..3 --allow-cgroup-failure
            # Feature D: the sweep must have auto-created the repo-local default profile store...
            csv="$(find .dagrun/profiles -name 'step_profiles_*.csv' 2>/dev/null | head -n1)"
            if [ -z "$csv" ]; then
              echo "expected a step_profiles_*.csv in the default profile store after sweep" >&2; exit 1
            fi
            # ...with a real header AND at least one data row (one per swept width, not just a header).
            head -n1 "$csv" | grep -q 'inner_jobs' \
              || { echo "profile store CSV header missing the inner_jobs column" >&2; exit 1; }
            rows="$(($(wc -l < "$csv") - 1))"
            if [ "$rows" -lt 3 ]; then
              echo "expected >=3 data rows (one per swept width 1..3) in $csv, got $rows" >&2; exit 1
            fi
            echo "::endgroup::"
          done
          rm -rf .dagrun
