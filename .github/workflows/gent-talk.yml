name: gent-talk

# gent-talk is a service, not one of the paired command-line tools, and it lives outside the `rs/`
# workspace with its own lockfile. The repository-wide `make check` / `make test` targets therefore
# do not see it, and this workflow is its whole gate.
on:
  push:
    branches: [main]
    paths:
      - 'gent-talk/**'
      - '.github/workflows/gent-talk.yml'
  pull_request:
    paths:
      - 'gent-talk/**'
      - '.github/workflows/gent-talk.yml'
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gent-talk
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked
      - name: smoke --help
        run: cargo run --locked -- --help

  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gent-talk
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: check the declared Rust 1.85 MSRV
        run: cargo check --locked --all-targets

  container:
    # The image is the deployment artifact; a Containerfile that stopped building would otherwise
    # only be discovered at deploy time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build the container image
        run: podman build -t gent-talk:ci -f gent-talk/Containerfile gent-talk
      - name: the server refuses to start without credentials
        run: |
          set -o pipefail
          if podman run --rm gent-talk:ci --version | grep -q '^gent-talk '; then
            echo "version smoke ok"
          else
            echo "the image did not report its version" >&2
            exit 1
          fi
          # No credentials in the environment: startup must FAIL rather than come up with defaults.
          if podman run --rm gent-talk:ci; then
            echo "the server started with no configuration at all" >&2
            exit 1
          fi
      # The startup channel probe, proven able to REFUSE in the real image. The unit tests prove it
      # classifies correctly; only this proves the binary actually runs it before serving.
      - name: the startup probe refuses a bot that cannot read its channels
        run: |
          # No --fake-discord: the real Discord client, a bogus token, and a channel nobody owns.
          # Whichever way CI's egress falls the answer is a probe failure — a 401 if discord.com is
          # reachable, "never reached Discord" if it is not — and either way the server must not
          # come up.
          if out=$(podman run --rm \
            -e GENT_TALK_DISCORD_BOT_TOKEN=not-a-real-token \
            -e GENT_TALK_READ_TOKEN=ci-read-token-0000000000000 \
            -e GENT_TALK_WRITE_TOKEN=ci-write-token-000000000000 \
            -e "GENT_TALK_CHANNELS=424242:ci channel:rw" \
            gent-talk:ci 2>&1); then
            echo "the server started even though its channel could not be read:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"
          grep -q "startup channel probe" <<<"$out" \
            || { echo "it refused, but not because of the probe" >&2; exit 1; }

      - name: ...and the skip switch turns it off, loudly
        run: |
          set -euo pipefail
          podman run -d --rm --name gent-talk-skip -p 18081:8080 \
            -e GENT_TALK_DISCORD_BOT_TOKEN=not-a-real-token \
            -e GENT_TALK_READ_TOKEN=ci-read-token-0000000000000 \
            -e GENT_TALK_WRITE_TOKEN=ci-write-token-000000000000 \
            -e "GENT_TALK_CHANNELS=424242:ci channel:rw" \
            -e GENT_TALK_SKIP_STARTUP_PROBE=1 \
            gent-talk:ci
          for _ in $(seq 1 30); do
            if curl -fsS localhost:18081/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS localhost:18081/healthz
          # A skip that says nothing is the same silent start the probe was added to remove.
          podman logs gent-talk-skip 2>&1 | grep -qi "SKIPPING the startup channel probe" \
            || { echo "the skip was not announced" >&2; podman logs gent-talk-skip; exit 1; }
          podman stop gent-talk-skip

      - name: the running server requires a token
        run: |
          set -euo pipefail
          podman run -d --rm --name gent-talk-ci -p 18080:8080 \
            -e GENT_TALK_DISCORD_BOT_TOKEN=not-a-real-token \
            -e GENT_TALK_READ_TOKEN=ci-read-token-0000000000000 \
            -e GENT_TALK_WRITE_TOKEN=ci-write-token-000000000000 \
            -e "GENT_TALK_CHANNELS=424242:ci channel:rw,515151:ci read-only:ro" \
            gent-talk:ci --fake-discord
          for _ in $(seq 1 30); do
            if curl -fsS localhost:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS localhost:18080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:18080/api/v1/channels)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-read-token-0000000000000' \
            localhost:18080/api/v1/channels)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Authorization: Bearer ci-read-token-0000000000000' \
            -H 'content-type: application/json' -d '{"text":"no"}' \
            localhost:18080/api/v1/channels/424242/reply)" = 403

      # The script the README tells the owner to run after `podman run` is run here against the
      # same image, so it cannot rot into a recipe that does not work. It is the deployment check;
      # a deployment check that has never been executed is worse than none.
      - name: the documented deployment check passes against the image
        run: |
          set -euo pipefail
          gent-talk/scripts/verify-deployment.sh \
            --url http://localhost:18080 \
            --channel 424242 \
            --read-token ci-read-token-0000000000000 \
            --write-token ci-write-token-000000000000

      # ...and reports a FAILURE rather than a pass when the thing it checks is untrue. A green
      # check that cannot go red certifies nothing.
      - name: the deployment check fails when it should
        run: |
          set -euo pipefail
          # A channel outside the allowlist must be refused, so pointing --channel at one must fail.
          if gent-talk/scripts/verify-deployment.sh --url http://localhost:18080 \
              --channel 777777 --read-token ci-read-token-0000000000000 --skip-post; then
            echo "the check passed against an unconfigured channel" >&2
            exit 1
          fi
          # A read-only channel must refuse post_reply, so the posting half must fail there.
          if gent-talk/scripts/verify-deployment.sh --url http://localhost:18080 \
              --channel 515151 --read-token ci-read-token-0000000000000 \
              --write-token ci-write-token-000000000000; then
            echo "the check reported a successful post to a read-only channel" >&2
            exit 1
          fi
          # A wrong token must not pass.
          if gent-talk/scripts/verify-deployment.sh --url http://localhost:18080 \
              --channel 424242 --read-token wrong-token-0000000000000000 --skip-post; then
            echo "the check passed with a wrong read token" >&2
            exit 1
          fi
          podman stop gent-talk-ci
