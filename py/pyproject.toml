[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-ci-dag-runner"
version = "0.5.0"
description = "Run a DAG of CI/build steps under nested cgroup CPU/memory boxing, with memory-aware concurrency and always-on resource logging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan Newton" }]
keywords = ["ci", "dag", "cgroup", "scheduler"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]
# Runtime dependency: YAML interchange (dag_from_yaml / dag_to_yaml). Parsed with yaml.safe_load
# and funneled through the same strict narrowing as JSON, so YAML is isomorphic to the JSON schema.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# Dev/test tooling. types-PyYAML supplies the yaml stubs mypy --strict needs (PyYAML ships none).
dev = ["mypy", "pytest", "types-PyYAML"]

[project.urls]
Repository = "https://github.com/rrnewton/agent-utils"

[project.scripts]
safe-ci-dag-runner = "safe_ci_dag_runner.cli:main"

[tool.setuptools.packages.find]
include = ["safe_ci_dag_runner*"]

[tool.setuptools.package-data]
safe_ci_dag_runner = ["py.typed"]

# mypy: strict, and no explicit `Any` allowed in our own annotations.
# (disallow_any_expr is intentionally NOT enabled yet — it fights stdlib return types;
#  revisit for absolute zero-Any once the port stabilizes.)
[tool.mypy]
python_version = "3.10"
strict = true
disallow_any_explicit = true
disallow_any_decorated = true
warn_unreachable = true
show_error_codes = true

# The test suite imports `pytest`, whose `pytest.approx` support pulls in numpy's type stubs
# transitively. numpy's stubs use 3.12-only `type` statements that error under our
# python_version=3.10 target. This project never uses numpy, so skip following it (no `Any`
# leaks into first-party code — numpy is not referenced anywhere here).
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true
