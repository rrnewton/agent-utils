[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "run-agent-prompt"
version = "0.1.0"
description = "Run one judgement-only prompt through the first answering agent harness."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Newton" }]
keywords = ["agent", "fallback", "one-shot", "recovery"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
]
dependencies = []

[project.optional-dependencies]
dev = ["mypy", "pytest"]

[project.urls]
Repository = "https://github.com/rrnewton/agent-utils"
Issues = "https://github.com/rrnewton/agent-utils/issues"

[project.scripts]
run-agent-prompt = "run_agent_prompt.cli:main"

[tool.setuptools]
packages = ["run_agent_prompt"]
package-dir = { run_agent_prompt = "." }
include-package-data = false

[tool.setuptools.package-data]
run_agent_prompt = ["py.typed", "README.md", "USER_GUIDE.md"]
