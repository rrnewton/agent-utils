# Example .herdr-run.yaml.
#
# Copy to the project root as `.herdr-run.yaml`. Every key is optional; the values below are the
# built-in defaults, spelled out so the policy is reviewable in the project's own history.

# Herdr workspace LABEL holding this project's command tabs.
workspace: agent-cmds

# One tab per agent: release-agent, build-agent, docs-agent, ...
# {agent} = invoking agent name, {project} = project directory basename.
tab_name: "{agent}"

# THE ALLOWLIST. Only these programs may cross the sandbox boundary.
allow:
  - git
  - gh

# Wrapper programs that may precede an allowlisted program, never run on their own.
prefixes:
  - with-proxy

# Run spools + audit log. MUST be git-ignored: this holds command output, not source.
spool_dir: .herdr-run

# Landing operations (git push, gh pr checks) can be slow on a loaded box.
timeout_seconds: 900

# Panes are shared with a human. Wait briefly rather than refusing the instant one is busy.
ready_timeout_seconds: 30
