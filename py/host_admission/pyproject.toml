[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "host-admission"
version = "0.1.0"
description = "A fail-closed shared-host resource admission ledger."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Newton" }]
dependencies = []

[project.scripts]

[project.optional-dependencies]
dev = ["mypy", "pytest"]

[project.urls]
Repository = "https://github.com/rrnewton/agent-utils"
Issues = "https://github.com/rrnewton/agent-utils/issues"

[tool.setuptools]
packages = ["host_admission"]
package-dir = { host_admission = "." }
include-package-data = false

[tool.setuptools.package-data]
host_admission = ["py.typed", "README.md", "USER_GUIDE.md"]
