[package]
name = "herdr-run"
version = "0.2.0"
description = "Run allowlisted commands through an out-of-sandbox Herdr pane with audited results"
readme = "README.md"
keywords = ["agents", "sandbox", "terminal", "allowlist"]
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22"
fs2 = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"

[[bin]]
name = "herdr-run"
path = "src/main.rs"

[lib]
name = "herdr_run"
path = "src/lib.rs"

[lints]
workspace = true
