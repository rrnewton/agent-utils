[workspace]
resolver = "2"
members = [
    "dagrun",
    "tick-hub",
    "pr-landing-planner",
    "herdr-run",
    "agentctl",
    "term-backend",
    "chat-subscription",
    "chat-subscription-plugin",
    "chat-subscription-fake",
    "chat-subscription-slack",
    "wrkslotsd",
    "gh-paced",
    "agent-usage",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rrnewton/agent-utils"
authors = ["Ryan Newton"]

[workspace.lints.rust]
missing_docs = "deny"
