[workspace]
resolver = "2"
members = [
    "testrun-core",
    "dagrun-model",
    "dagrun",
    "tick-hub",
    "pr-landing-planner",
    "herdr-run",
    "agent-queue",
    "agent-harness",
    "agentctl",
    "claude-stream-session",
    "term-backend",
    "chat-subscription",
    "chat-subscription-plugin",
    "chat-subscription-fake",
    "chat-subscription-slack",
    "wrkslotsd",
    "wrkviz",
    "gh-paced",
    "agent-usage",
    "agent-teams",
    "merge-queue",
    "change-classifier",
    "local-ci-hub",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rrnewton/agent-utils"
authors = ["Ryan Newton"]

[workspace.lints.rust]
missing_docs = "deny"
