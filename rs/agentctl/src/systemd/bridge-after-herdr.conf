# Installed by `agentctl install-units` as a drop-in for the chat bridge unit.
#
# The bridge needs the Herdr server. Ordering it after the server and pulling the server in is what
# fixes the boot race, where every start failed within one second because the server did not exist
# yet. Start limits are deliberately left to the bridge's own resource policy: a low burst keeps a
# crash-looping bridge from re-sending replies.
[Unit]
Wants=herdr-server.service
After=herdr-server.service

[Service]
Restart=on-failure
RestartSec=10
