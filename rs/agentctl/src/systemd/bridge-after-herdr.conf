# Installed by `agentctl install-units` as a drop-in for the chat bridge unit.
#
# The bridge needs the Herdr server. Order it after the server, pull the server in, and retry
# through a slow boot: one attempt every 10 seconds for up to 15 minutes, where five attempts in
# 60 seconds can all fail within one second while the server is still starting.
[Unit]
Wants=herdr-server.service
After=herdr-server.service
StartLimitIntervalSec=900
StartLimitBurst=90

[Service]
Restart=on-failure
RestartSec=10
