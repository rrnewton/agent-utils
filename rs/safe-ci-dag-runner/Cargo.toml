[package]
name = "safe-ci-dag-runner"
version = "0.7.0"
description = "Run a DAG of CI/build steps under nested cgroup CPU/memory boxing, with memory-aware concurrency and always-on resource logging."
readme = "README.md"
keywords = ["ci", "dag", "cgroup", "scheduler"]
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# JSON parsing only (no `#[derive(Deserialize)]`): the strict reader in io.rs replicates Python's
# exact narrowing (e.g. bool-is-not-int) by hand, and serialization is hand-rolled to reproduce
# Python's `json.dumps(indent=2)` byte-for-byte (key order, 2-space indent, float formatting),
# which a derive + default serde_json round-trip cannot guarantee. (serde_json still transitively
# depends on serde_core/serde_derive via Cargo.lock; we simply do not USE the derive macro.)
# `float_roundtrip` makes serde_json's float PARSER correctly rounded, so a float literal loads to
# the same f64 Python's json.loads produces — a prerequisite for byte-identical re-emission.
serde_json = { version = "1", features = ["float_roundtrip"] }
# YAML interchange (FEATURE: YAML is isomorphic to the JSON schema). serde_yaml is ARCHIVED;
# serde_norway is its maintained, actively-updated fork keeping the same serde API and YAML 1.2
# core-schema semantics. We deserialize YAML directly into `serde_json::Value` so the YAML path
# funnels into the EXACT same strict narrowing (`dag_from_value`) as JSON — identical model
# construction, one code path. (serde_yml is a deprecated/unmaintained shim; yaml-rust2 is a bare
# parser with no serde-Value integration.) NOTE: serde_norway pulls in unsafe-libyaml-norway
# (libyaml transpiled to Rust), so the YAML parser contains `unsafe` internally; this project's own
# code stays 100% safe Rust. This is inherent to the serde-YAML ecosystem (the archived serde_yaml
# used unsafe-libyaml the same way); the only pure-safe alternative, yaml-rust2, lacks serde-Value
# integration.
serde_norway = "0.9"
# Safe (no-`unsafe`) SIGINT/SIGTERM registration for the cgroup scope-teardown handler: on
# Ctrl-C the whole outer scope is torn down so no setsid-escapee orphans survive. std has no
# signal API, and this project is safe-rust; signal-hook encapsulates the unsafe internally.
signal-hook = "0.4.4"

[[bin]]
name = "safe-ci-dag-runner"
path = "src/main.rs"

[lib]
name = "safe_ci_dag_runner"
path = "src/lib.rs"
