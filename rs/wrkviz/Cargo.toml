[package]
name = "wrkviz"
version = "0.1.0"
description = "Durable agent-team timeline archives: the Rust edition, growing subcommand by subcommand behind the wrkviz CLI"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
agent-harness = { version = "0.1.0", path = "../agent-harness" }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ctrlc = "3"
chrono-tz = "0.10"
fs2 = "0.4"
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order"] }
sha2 = { version = "0.10", default-features = false }

[[bin]]
name = "wrkviz"
path = "src/main.rs"

[lib]
name = "wrkviz"
path = "src/lib.rs"

[lints]
workspace = true
