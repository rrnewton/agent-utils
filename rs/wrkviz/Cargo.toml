[package]
name = "wrkviz"
version = "0.1.0"
description = "Durable agent-team timeline archives: the Rust edition, growing subcommand by subcommand behind the wrkviz CLI"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[[bin]]
name = "wrkviz"
path = "src/main.rs"

[lib]
name = "wrkviz"
path = "src/lib.rs"

[lints]
workspace = true
