[package]
name = "merge-queue"
version = "0.1.0"
description = "Local merge queue: orders, batches, validates and lands ready changes while keeping the base branch green"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
pr-landing-planner = { path = "../pr-landing-planner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"

[[bin]]
name = "merge-queue"
path = "src/main.rs"

[lib]
name = "merge_queue"
path = "src/lib.rs"

[lints]
workspace = true
