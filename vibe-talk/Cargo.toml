[workspace]
members = ["."]

[package]
name = "vibe-talk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rrnewton/agent-utils"
authors = ["Ryan Newton"]
description = "A voice-agent bridge that reads and answers about Discord channels from a phone."
publish = false
# There are two binaries, and every `cargo run` in the README, in scripts/, and in CI means the
# server. Without this, adding the mock turned all of them into "could not determine which binary
# to run" — a second target must not change what the first command in the quickstart does.
default-run = "vibe-talk"
# The integration tests are one binary, `tests/integration.rs`, plus the two that must have a
# process of their own (`vibe-talk-test-debuginfo`): see that file.
autotests = false

[lib]
name = "vibe_talk"
path = "src/lib.rs"

[[bin]]
name = "vibe-talk"
path = "src/main.rs"

# The offline ElevenLabs substitute, as a process, for the browser harness and the smoke script.
# NOTE FOR THE CONTAINERFILE: an explicit `[[bin]]` whose path does not exist makes cargo refuse
# to read this manifest at all, which would break the image's dependency-cache stage — that stage
# writes only src/main.rs and src/lib.rs. Containerfile creates a matching placeholder; if this
# target is renamed or moved, that placeholder has to move with it.
[[bin]]
name = "vibe-talk-mock-elevenlabs"
path = "src/bin/mock_elevenlabs.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "egress_proxy"
path = "tests/egress_proxy.rs"

[[test]]
name = "voice_page"
path = "tests/voice_page.rs"

[dependencies]
anyhow = "1"
# The sanitizer every rendered message body passes through before it reaches the page. See
# `src/render.rs`: comrak writes the HTML, and ammonia decides what of it may exist.
ammonia = "4"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
base64 = "0.22"
bytes = "1"
# Message bodies are rendered HERE, not in the browser: GitHub-flavoured Markdown with chat's line
# breaks. Without default features: its command-line front end is not wanted, and its own syntect
# plugin writes a class for every scope a grammar names, hundreds of them, where the sanitizer
# wants a short fixed list. Code blocks are highlighted through comrak's highlighter interface by
# `src/render/highlight.rs` instead, with syntect directly (below). 0.55 rather than the newest
# because 0.56 raised its minimum Rust past this crate's declared 1.85.
comrak = { version = "0.55", default-features = false }
# Ticket minting only: 256 bits from the system CSPRNG. Already in the tree transitively.
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# `tzdb-bundle-always` compiles the IANA database into the binary. The runtime image has no
# `tzdata` package, and a server that fell back to UTC for want of one would silently reproduce
# the wrong-zone bug this dependency was added to fix. See `src/clock.rs`.
jiff = { version = "0.2.24", default-features = false, features = [
    "std",
    "tzdb-bundle-always",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    # Read-aloud forwards the vendor's audio to the browser as it arrives rather than buffering the
    # whole file first, which is what lets playback start before generation has finished.
    "stream",
] }
# SHA-256 only, for the content hashes the page's static files are cached under (`src/http/assets.rs`).
# Already in the tree transitively, through rustls.
ring = { version = "0.17", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# Derives the checked-in wire contract (`src/contract.rs`) from the same types serde serializes, so the
# browser's generated declarations and validators cannot describe a shape the server does not send.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The code-block highlighter (`src/render/highlight.rs`, `#531 server-side-syntax-highlight`). Only
# the parser: no bundled themes (colours come from the stylesheet), no bundled grammars (`build.rs`
# writes a compact set), no HTML writer (ours writes a fixed list of classes). Oniguruma rather than
# the pure-Rust `regex-fancy`: measured on this crate, it highlighted 2.5 times as fast and made the
# binary 350 KB SMALLER (see the README's rendering section). The cost is a C library, built from
# source by `cc` as rusqlite's bundled SQLite already is.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
thiserror = "2"
# The search language's folding (`src/search_query.rs`): NFD and the combining-mark property, so
# `cafe` finds "café". Already in the tree transitively, through comrak's `caseless`.
unicode-normalization = "0.1"
# `process` runs `[summaries.llm].bearer_token_command` with a timeout that KILLS a hung child
# (`kill_on_drop`), which `std::process` cannot do without leaking a blocked thread.
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# `rustls-tls-webpki-roots` is what lets this crate dial a `wss://` URL at all: without a TLS
# feature, `connect_async` refuses the scheme outright, and the ONLY signed URL ElevenLabs mints is
# `wss://`. rustls rather than native-tls, and bundled roots rather than the platform store, so
# that the summariser's socket makes the same trust decision as `reqwest` above it -- one TLS
# stack, and a trust set that does not vary with the host the container happens to run on.
#
# It costs a SECOND copy of `webpki-roots` in the lockfile (0.26 for tungstenite, 1.0 for reqwest),
# because the two crates pin different majors. That is a duplicated root list, not a second TLS
# implementation, and it collapses on its own the moment tungstenite moves to 1.0.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
# `#553 voice-ws-relay-auth`: the relay accepts a browser's WebSocket upgrade itself (axum's own
# `ws` feature would bring a second tungstenite major), and read-aloud dials a relay whose
# certificate a private authority issued. All four are already in the tree, at these versions,
# through axum, reqwest and tungstenite; only these lines' own entries are new.
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Response compression. Everything the server sent went out uncompressed — the page script alone
# was 836 KB on every cold load, over phone and airplane links. Already in the tree transitively.
tower-http = { version = "0.6", default-features = false, features = ["compression-br", "compression-gzip"] }
# The URL parser ammonia judges a link's address with, asked the same question before the HTML is
# written so a link the sanitizer would strip is shown as text instead. Already in the tree through
# ammonia and reqwest; see `render::web_address`.
url = "2"

# The message cache's file lock and its directory-ownership check (`src/cache/file.rs`): `flock`,
# the effective user id, and the host name the default cache path carries. Safe wrappers, because
# this crate forbids `unsafe`, and the standard library's own `File::lock` arrived after the
# declared Rust 1.85.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "std", "system"] }

# `build.rs` writes the highlighter's compact syntax set: a subset of two-face's grammars (bat's
# collection) and the ones in `syntaxes/`. Build time only; none of this is in the binary but the
# set it writes. `syntect-onig` selects two-face's grammars for the runtime's regex engine.
[build-dependencies]
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig", "yaml-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }

[dev-dependencies]
http-body-util = "0.1"
# The live ElevenLabs client is exercised against a one-shot loopback HTTP server, which is what
# pins the API key to a HEADER rather than the query string. That needs raw sockets in tests.
#
# `test-util` is what makes the poll loop's rate-limit BACKOFF assertable: the assertion is about
# how long the loop waited, and against the real clock that is either a slow test or a flaky one.
# With a paused clock the elapsed time is exact and the suite still finishes instantly.
tokio = { version = "1", features = ["io-util", "net", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
missing_docs = "deny"

# Debug and test builds keep line tables only (`vibe-talk-test-debuginfo`, 2026-10-26). With
# full debuginfo every integration-test binary was about 330 MB, and one dev-profile build of the
# suite about 30 GB, which the shared validation host's disk could not keep up with. Line tables
# still give file and line in backtraces and panics; dependencies keep none, because nobody steps
# through them here. `cargo test --release`, which validation runs, is unaffected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
