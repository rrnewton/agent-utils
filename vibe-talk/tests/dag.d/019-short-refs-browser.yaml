steps:
  - group: check
    job: short-refs-browser
    desc: short references link, highlight, and drill in, in current Chromium at 1280x800 and 390x852
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/short_refs_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 20
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#219 emoji-reactions` in the browser engine: each message's reaction strip under its text,
  # inside its row and the screen, clear of the row's buttons and links, the thread root's reply count
  # below it, and each count legible, at two phone widths and a desk, in the dark and light schemes.
