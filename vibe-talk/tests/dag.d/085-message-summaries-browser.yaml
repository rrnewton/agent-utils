steps:
  - group: check
    job: message-summaries-browser
    desc: an unpacked row with a wide code block never pushes the thread list past a phone's edge, and a failed summary is a quiet label that leaves the row's Done state and Unarchive alone, in current Chromium at 393x852, 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/message_summaries_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 12
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#408 copy-upstream-link` as `#409 open-upstream-link` leaves it, in the browser engine: the fake
  # channel as Slack, its long question carrying its own address there as a served read would. At
  # 1280x800 and 393x852 its ⋯ menu offers the "Open in Slack" link second under Copy text, wholly
  # inside the window; the link and a real Shift+O open the address in a new page whose opener is
  # null with this page unmoved; a real l puts the address on the clipboard whole (read back with
  # `clipboard-read` granted, a sentinel on it before the key) and the status pill says so; a message
  # with no address offers no item and neither key does anything.
