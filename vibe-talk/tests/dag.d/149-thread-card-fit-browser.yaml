steps:
  - group: check
    job: thread-card-fit-browser
    desc: thread cards fitted to their words and fully read cards drawn read, packed, unpacked and under every read mode, in current Chromium at 1280x800 and 393x852
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/thread_card_fit_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 720
    cpu_timeout: 90
    hint:
      resources: {browser: 1}
      est_duration_s: 30
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#245 done-feedback` in the browser engine: on a threaded channel at 1280x800, in the dark scheme and
  # the light one, a selected unread message is ringed solid in the accent and a selected read one
  # dashed in grey on the same lit surface, each at 3:1 or more against it, by computed style; e draws
  # the moment on the row it left (the done-marking animation running, the dashed grey ring at the read
  # strength, then neither); the Undo chip names the message and puts it back, and an Undo inside the
  # hold takes the ring away at once; under reduced motion the same look arrives with no animation; at
  # 412x915 and 1280x800 in both schemes the moment and a selected read message, measured, with nothing
  # floating over the message box; on a 360px and a 412px phone the Undo chip says only "Undo", taking no
  # line a bare one did not, and at 1280x800 it names the message on one line; and at all three, walked
  # up from the end of the list a few pixels at a time through the message box, no chip and no status
  # pill ever meets the box or its Send. Served through Playwright's request routing, so it opens no port.
  # Measured on 2026-10-12: about 40s wall.
