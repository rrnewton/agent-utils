steps:
  - group: check
    job: voice-reconnect-browser
    desc: a voice bridge that loses a turn and asks to reconnect — the call carried on a new session, the lost relay sent again once, the bound and a non-reconnect error still ending it — in current Chromium
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/voice_reconnect_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 720
    cpu_timeout: 90
    hint:
      resources: {browser: 1}
      est_duration_s: 21
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#431 voice-transcript-expand` in the browser engine, at 393x852 by touch and 1280x800 by mouse: a
  # reply streamed a sentence a frame over a fake vibe-talk-v1 bridge grows past the fold and is never
  # folded while spoken, the list following its newest line; a tap on the card closes it and another
  # opens it; a long reply that arrives whole arrives folded and opens on a tap at the newest line; a
  # fold the reader sets mid-reply holds through its later frames; scrolled up, a card opens without
  # moving it or the row above. Served through Playwright's routing, so it opens no port. Measured on
  # 2026-10-22: about 11s wall.
