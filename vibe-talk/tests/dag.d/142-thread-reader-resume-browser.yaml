steps:
  - group: check
    job: thread-reader-resume-browser
    desc: read-aloud resumes at its chunk after drilling into the thread and back out, and stops with a word in place where the message is absent, in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/thread_reader_resume_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 12
      classification: latency-bound
      preferred_inner_jobs: 4
  # `#1856 vibe-talk-read-aloud-follow-not-yanked-up` in the browser engine, at 412x915 by touch
  # and 1280x800 with a mouse: Read on a long reply in its thread follows down and is never
  # yanked back up across live repaints; scrolled fully off, the Reading chip rises and
  # tapping it brings the message back.
