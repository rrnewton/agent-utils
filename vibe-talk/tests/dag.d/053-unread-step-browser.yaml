steps:
  - group: check
    job: unread-step-browser
    desc: Shift+arrows step through only the unread messages of a mixed list, stopping with a hint at either end, in current Chromium at 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/unread_step_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 12
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#1710 vibe-talk-readerbar-sound-overlap` in the browser engine: Sound and the cloud/device
  # selector stacked in the phone reader bar's left column, at 412x915 (device scale 2.6) and
  # again at a 130% root font, with the desktop reading pane unchanged.
