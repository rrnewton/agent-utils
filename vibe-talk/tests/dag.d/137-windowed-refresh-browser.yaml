steps:
  - group: check
    job: windowed-refresh-browser
    desc: windowed budgets (5000 mount at most the cap, a screenful at most 20, off-screen edit no DOM), in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/windowed_refresh_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 7
      classification: latency-bound
