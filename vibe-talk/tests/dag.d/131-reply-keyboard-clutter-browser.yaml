steps:
  - group: check
    job: reply-keyboard-clutter-browser
    desc: one Send only, no floating chips and a compact reply row while the keyboard is up, all back as it goes, in current Chromium at 393x852 by touch and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/reply_keyboard_clutter_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 16
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#1725 vibe-talk-undo-chip-stretched` in the browser engine: at a 412x915 phone (device scale
  # 2.6) in the light scheme and the dark, with the Discuss half-pane docked open and a dismissal's
  # Undo up, replying with the keyboard up (the viewport 360px shorter) keeps the Undo chip at a
  # chip's height, the chips strip one line, neither over the reply box or Send reply, and the
  # keyboard down puts the chip back at the list's foot above the pane; at a 1280x800 desk with
  # Discuss open the chip never moves or stretches when the window shortens.
