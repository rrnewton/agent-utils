steps:
  - group: check
    job: read-pause-reply-browser
    desc: a read paused, the message replied to and sent, then resumed, by both voices in current Chromium at 393x852 touch, the read going on from where it was held; and in a paused read, at 393x852 by touch and 1280x800 by mouse, the Quoted reply chip and the strip's Quote reply topmost wherever the words are, the quick reply typed and dictated into and sent quoted; and React on a paused read (#821) at 360, 375 and 412 wide by touch and 1280x800, the held sentence lit and quoted, the arrows 52px with React at the row's far right, dictation by a stand-in recognition, the keyboard's microphone without one, and a one-block device-voice read
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/read_pause_reply_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    # Failure bounds, not a performance verdict (#1250): solo under dagrun accounting this takes
    # 26.8 s CPU / 102 s wall, so keep more than five times that headroom under hot-host load.
    timeout: 960
    cpu_timeout: 180
    hint:
      resources: {browser: 1}
      est_duration_s: 55
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#567 pace-stepper` in the browser engine: the Pace popover's [-] [100%] [+] stepper, no slider, at
  # 393x852 by touch (targets at least 44 px) and 1280x800: + to 130%, arrows, typed and clamped values,
  # and a change mid-read reading the block again, each waited for as drawn state or a fresh ticket for
  # the same block (`#1250 vibe-talk-timing-robust`). The verdict is behaviour only; the ticket times
  # are printed, and the old wait bounds are an opt-in `--benchmark` outside the gate.
