steps:
  - group: check
    job: incremental-refresh-browser
    desc: live updates touch only their rows (no-change poll zero, one edit one row), in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/incremental_refresh_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 7
      classification: latency-bound
  # DISABLED from gating (`disabled-optin`): this entry shared one
  # mapping with refresh-replaces below (a second `job:` key in the
  # same entry), so it silently never compiled while the page changed
  # under it; it fails on main today and is fixed in #1880
  # (mu-readerdrill). It keeps its own entry so it re-enables cleanly
  # once that lands; runnable by hand
  # (`make -C vibe-talk composer-stays-browser`, or validate
  # --include-disabled) meanwhile.
