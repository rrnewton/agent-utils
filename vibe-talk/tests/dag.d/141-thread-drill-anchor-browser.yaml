steps:
  - group: check
    job: thread-drill-anchor-browser
    desc: drilling into a thread keeps the clicked message at the same viewport offset, through late layout and Back, in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/thread_drill_anchor_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 7
      classification: latency-bound
  # `#1838 vibe-talk-reader-continues-into-thread` in the browser engine, at 412x915 by touch and
  # 1280x800 with a mouse: Read on a long reply in All, tapped into its thread mid-chunk, resumes
  # on that chunk at the anchor's place and goes on to the next reply; Back resumes again; a
  # switch to a view without the message stops the read and says so in place.
