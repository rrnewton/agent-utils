steps:
  - group: check
    job: scroll-stability-browser
    desc: the message lists hold the reader's row through live messages, refreshes, a read landing after a scroll, summaries, focus moves, the view keys and the mouse crossing the cards with or without a card highlighted, follow only a reader on the newest line, and open threads and the thread list at their foot, in current Chromium at 1280x800 and 412x915; and the thread list holds the card being read while replies move other cards to its foot, at 393x852 and 1280x800; every hold judged when its drawn batch settles, never by a held window or a frame count
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/scroll_stability_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 960
    cpu_timeout: 120
    hint:
      resources: {browser: 1}
      est_duration_s: 140
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#1210 ui-stability-no-async-shift` in the browser engine, at 393x852 by touch and 1280x800: a reader
  # parked mid-Main with a draft held, sampled at every frame for 60 s of background updates (channel
  # messages, thread replies, edits above and below, reactions above, on the anchor and on a folded card,
  # read state by re-read, the Newest recount, the 45 s poll; collapsed summaries off, the owner's
  # setting), each update reported separately so a mover is named, plus a near-foot slack coda and a
  # closing control with anchoring off proving the watch sees a shift. REPORT-ONLY until part D lands
  # (--strict asserts; TODO(#1210) flip when green). First runs 2026-11-10, summaries off: anchor within
  # 0.4px everywhere; near-foot thread-reply snap 18px at both sizes; desk thread card resort shift 0.068.
  # Summaries on (--summaries on): summaries landing shifted 0.22-0.24 at both sizes.
  # DISABLED UNTIL ROBUST under `disabled-optin` (#1589 scroll-soak-load-flake; owner
  # rule 346): the phone folded-demote act moves the anchor 28.1px under host load and
  # failed three unrelated owner-UI gates the same way, on unchanged code. It stays
  # runnable by hand (`make -C vibe-talk scroll-soak-browser`, or validate
  # --include-disabled) and returns only on the re-enable bar in #1589.
