steps:
  - group: check
    job: thread-card-markdown-browser
    desc: a long Markdown first message's thread card keeps its formatting, splits only between lines, waits for its summary in the summary's layout, and draws a known summary with the page, a table first is one line on the card and whole under it from the first frame (#533), and a page older than the server's offers a reload (#529), in current Chromium at 393x852 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/thread_card_markdown_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 960
    cpu_timeout: 120
    hint:
      resources: {browser: 1}
      preferred_inner_jobs: 4
      est_duration_s: 30

  # `#532 shift-o-latency` in the browser engine: twenty threads of long replies unpacked in the Threads view;
  # eight Shift+O folds and eight e Done marks, each drawn folded or Done, and hiding one row restyling a
  # few elements rather than the page (a #429 rule on a touch screen restyled about 5,000). The verdict is
  # that behaviour only; handler times are printed, and the old millisecond budgets are an opt-in
  # `--benchmark` outside the gate. Measured on 2026-10-26: about 20s wall.
