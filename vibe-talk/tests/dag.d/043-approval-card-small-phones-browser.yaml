steps:
  - group: check
    job: approval-card-small-phones-browser
    desc: the send card's place, reach, hold, docked layout, frozen card and recap line, the channel's list held still and a reader who saw only the card, at 360x780 and 375x667, and the trips to Settings and Help at 375x667, in current Chromium
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/approval_card_browser.py --part small-phones
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 800
    # CPU, measured: ~55 CPU-s solo (systemd scope accounting) against
    # ~180 s wall. Under gate load the wall stretches several-fold and
    # the open page keeps rendering (and the walk keeps polling) for
    # all of it, so CPU grows with the stretch; 100 CPU-s only fit an
    # unloaded host. 300 keeps ~2x headroom over the loaded figure
    # without letting a runaway step burn unbounded CPU.
    cpu_timeout: 300
    hint:
      resources: {browser: 1}
      est_duration_s: 200
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

