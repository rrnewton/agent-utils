steps:
  - group: check
    job: typing-scroll-browser
    desc: typing at the foot keeps the whole composer in view across arrivals, keyboard resizes and late row growth, reading scrollback holds, and hover scrolls neither column, in current Chromium at 412x915, 360x800 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/typing_scroll_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 25
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # After a send, the row at the list's end is judged only once its geometry has held across several
  # consecutive animation frames (#1243 keyboard-bar-settle); the assertion itself is unchanged.
