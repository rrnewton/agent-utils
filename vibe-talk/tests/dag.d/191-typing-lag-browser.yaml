steps:
  # `#2429 vibe-talk-typing-never-lags`: typing in a composer does constant work per keystroke however
  # long the channel. About 1,200 rows (over 100k px, windowed off), the glossary on and linked; 100
  # keys in the channel composer and 100 in the reply box, desk and phone. Counted per key through its
  # frame, never timed: no text nodes walked (the glossary's whole-list pass), box reads and queried
  # elements a small constant. Script time per key is printed as a report only.
  - group: check
    job: typing-lag-browser
    desc: typing in the channel composer and the reply box walks no list text and reads a constant handful of boxes per keystroke over 100k px of rows with the glossary on, in current Chromium at 1280x800 and 412x915 by touch (#2429)
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/typing_lag_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 600
    cpu_timeout: 240
    hint:
      resources: {browser: 1}
      est_duration_s: 150
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1610612736
