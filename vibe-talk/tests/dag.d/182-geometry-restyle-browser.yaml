steps:
  - group: check
    job: geometry-restyle-browser
    desc: the page's measured geometry (#2277) restyles only the elements that read it, no row inherits it, the page's own scroll passes never restyle the whole document, and typing at the foot with the keyboard up while messages arrive never writes the list back and forth (the composer still within 0.5px, its Send row above the keys), counted in current Chromium at 412x915 by touch and 1280x800 with 260 rows
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/geometry_restyle_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 25
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824
