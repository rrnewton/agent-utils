steps:
  - group: check
    job: menu-above-chips-browser
    desc: a row menu above the floating chips in current Chromium at 1280x800 and 393x852, every item topmost at its centre
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/menu_above_chips_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 480
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 25
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#49 post-confirmation-card-hold` in the browser engine: a real touch on Send the moment a first
  # card appears in a typed call commits nothing, and Send enables itself after the hold.
