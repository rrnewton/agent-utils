steps:
  # DISABLED from gating (`disabled-optin`, #2293): held_walk can wait the
  # hang backstop without the thread option arriving on unmodified main under
  # load, so a longer wall-clock budget is not the fix. It stays runnable by
  # hand / validate --include-disabled and returns only on #2293's condition-
  # based, hot-host proof.
  - group: check
    job: read-modes-browser
    desc: a thread entered on its first unread, a collapsed read run opened by a real tap, and Main's unread-replies count, in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page, disabled-optin]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/read_modes_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 15
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

