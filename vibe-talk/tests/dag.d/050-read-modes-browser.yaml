steps:
  # Re-enabled by #2293's fix: the fake consumes POST bodies (keep-alive
  # poison, #2307), a failed directory read retries once in the page, and
  # held_walk's waits name their page condition with a hang backstop only.
  - group: check
    job: read-modes-browser
    desc: a thread entered on its first unread, a collapsed read run opened by a real tap, and Main's unread-replies count, in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/read_modes_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 15
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824
