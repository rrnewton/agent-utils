steps:
  - group: check
    job: documents-browser
    desc: the Documents list, a touch fetch into the reader, and a fetch error on its row, against the real server (fake chat upstream) in current Chromium at 393x852
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/documents_browser.py
    jobs_flag: ""
    deps: [build.release, setup.contract-tools]
    timeout: 480
    cpu_timeout: 120
    hint:
      resources: {browser: 1}
      est_duration_s: 90
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # The multi-level document scrubber (`#1508`): numbers on the document,
  # navigator rows within their cap, and tap-a-unit reading, at both widths.
