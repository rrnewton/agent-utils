steps:
  - group: check
    job: elision-browser
    desc: every folded message's label claims no more than its clamp hides, in seven layouts, in current Chromium
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/elision_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 480
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 7
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#301 semicolon-expand-cycle` in the browser engine, at a 1280x800 desk with the keys: ; four times and :
  # three times in one column step the long messages round Expanded all, Expanded unread, collapsed read,
  # and Collapsed all, each judged by whether every message's text overflows its box (folded) or is drawn
  # whole, read and unread, with the status line saying the step politely; the selected message, sampled at
  # every frame from each press until the step is drawn and further frames have run (`#1250`), moves by
  # no more than a pixel, at the newest line too; in two
  # columns, the right column's thread at its foot, ; there steps it alone and holds its reader — a : that
  # opens only what is under the reader too, which scrolls nothing and so, unheld, the right column's keeper
  # of its foot took 679px down a frame later — and ; in Main is Main's own first step. Ctrl+;, Cmd+; and
  # Ctrl+: step from the channel's message box at the list's foot, where a ; typed is the draft's and steps
  # nothing, the focus and the draft left as they were and the box itself, not the selected message, held
  # where it is and shown whole at every frame; and Ctrl+; in the right column's box steps the right
  # column's thread, Main untouched, that box held. Served through Playwright's request routing, so it
  # opens no port. About 17 s wall solo since the watches became drawn-state plus settle frames.
