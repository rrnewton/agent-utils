steps:
  - group: check
    job: refresh-replaces-browser
    desc: a no-change poll refresh (restamped observed_ms only) replaces zero channel rows and zero thread cards, in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page, disabled-optin]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/refresh_replaces_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 100
      classification: latency-bound
      preferred_inner_jobs: 4
