steps:
  - group: check
    job: message-rerender-browser
    desc: a re-rendered block post's bullets and link labels, in current Chromium at 390px and on a desk
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/message_rerender_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 20
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#1867 vibe-talk-save-draft-chip-covers-text`: the Save draft chip never
  # covers typed words, at a phone's and a desk's size, against the real server.
