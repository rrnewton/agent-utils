steps:
  - group: check
    job: compact-rows-browser
    desc: a collapsed row's header on one line with its name cut by an ellipsis, Reply and Done only once it is opened and then together with the other controls, a Thread tag the size of Reply in its thread's colour, and a wide list keeping every control, in current Chromium at 393x852, 1280x800 and two columns at 1280x800 and 1024x768
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/compact_rows_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 6
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#425 collapsed-lines` in the browser engine, at 1280x800 with the keys and at 393x852 by touch: a
  # folded long message's body in Main is 3 lines until Ctrl+( and Cmd+( step it to 1 and to 0 (the
  # header alone, no gap where the body was, reactions still drawn) with the count said and the chord
  # taken from the zoom, Ctrl+) back up to 6 and no past 8, by bracket and by digit place, never in
  # the message box; the Settings slider and its - and + set the same count and a reload keeps it;
  # the row being read holds its place as the count changes and the newest line is kept; the same
  # count folds a thread's rows and rows unpacked under their cards, and a raw thread card is the
  # count tall (one line at 0, a card's text being its name); at 0 a row still opens whole, the
  # selection still moves and Reply still opens. The negative control requires an open body past
  # every count. Served through Playwright's request routing, so it opens no port.
