steps:
  # `#1990 vibe-talk-archive-single-row-dress` in the browser engine: one `e` archive and
  # unarchive over an 816-message channel dress at most 20 rows, write at most 100 classes
  # and read at most 50 layouts, and with windowed lists on an off-screen selected row is
  # archived from the keyboard without mounting or measuring the list.
  - group: check
    job: archive-single-row-browser
    desc: archive and unarchive dress only the acted rows and neighbours, and an unmounted windowed row is archived without mounting, in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/archive_single_row_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 30
      classification: latency-bound
      rss_baseline_bytes: 1073741824
