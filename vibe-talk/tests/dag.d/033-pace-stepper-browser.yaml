steps:
  - group: check
    job: pace-stepper-browser
    desc: the Pace popover's stepper in current Chromium at 393x852 by touch and 1280x800, stepping, typing, clamping and a mid-read change
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/pace_stepper_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 480
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 25
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#1228 menu-above-chips` in the browser engine: a row's ellipsis menu over the floating chips
  # row at 1280x800 and 393x852, every item the topmost element at its centre.
