steps:
  - group: check
    job: discuss-browser
    desc: the Discuss panel opened, read, marked and jumped from, against the real server (fake chat upstream, contract-shaped catchup answer at the network edge) in current Chromium at 393x852 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/discuss_browser.py
    jobs_flag: ""
    deps: [build.release, setup.contract-tools]
    timeout: 480
    cpu_timeout: 120
    hint:
      resources: {browser: 1}
      est_duration_s: 60
      classification: latency-bound
      preferred_inner_jobs: 4
      # `#2319 vibe-talk-discuss-browser-memory-hint`: one Chromium walk needs more
      # than 1 GiB. Of 91 profiled runs, 6 were OOM-killed at the 1.25 GiB cap that
      # baseline set (NO_RESULT); runs under a larger cap peaked at 1.42 GiB (median
      # 1.18). 1.75 GiB puts the cap near 2.19 GiB, above the peak with headroom.
      rss_baseline_bytes: 1879048192

  # `#1820 vibe-talk-summary-strikethrough-live`: archiving from a cited
  # message's own row strikes its summary bullet with no reload, and
  # repeated citation follows always land on screen.
