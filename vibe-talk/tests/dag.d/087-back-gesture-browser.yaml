steps:
  - group: check
    job: back-gesture-browser
    desc: the browser's Back closes a thread, the thread list, a thread opened from it and a menu over either in the same document, one per press, keeping the reader's place, stands on the earlier load's entries after a reload, and leaves the app only from the top, in current Chromium at a 412x915 Android phone in standalone mode and a 1440x900 desk
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/back_gesture_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 480
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 8
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#324 live-pill-covers-row` in the browser engine, at a 412x915 phone with touch, in the dark scheme and the
  # light, the live stream attached so the pill says "Live · updated": in Main, the summed-up thread's unread
  # chip scrolled onto the pill's line is clipped by the list's top edge, not covered, and the list scrolled
  # through nine places has nothing of it under the pill or the glass, by a tap through the pill at points
  # across the line and by the screen's own background in every pixel there; a thread entered from its root
  # lands with the root's date rule below the floating line, nothing of the list between the thread's card
  # and the pill, and nothing under the line at nine places. Its controls lay the old room, padding inside the
  # scroller, over the page, and find the list under the pill. Against the page before it, the unread chip is
  # under the pill; with the new style sheet and the old landing, the date rule is. Measured on 2026-10-15:
  # about 22s wall.
