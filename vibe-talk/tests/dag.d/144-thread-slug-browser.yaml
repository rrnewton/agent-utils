steps:
  - group: check
    job: thread-slug-browser
    desc: a slugged root's Thread tag shows emoji, slug and count with a greyed emoji, falling back without room or a slug, in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/thread_slug_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 7
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#1557 discord-split-merge-regression` in the browser engine, at 390x844 by touch and 1280x800
  # with a mouse, in Main: a Discord post the plugin split at the 2,000-char cap (three chunks a
  # second apart, only the first answering the prompt, each an unanswered potential root) is one
  # row standing for all three ids, while another author's message and the bot's later post keep
  # rows of their own, no row wider than the screen, and no page error.
