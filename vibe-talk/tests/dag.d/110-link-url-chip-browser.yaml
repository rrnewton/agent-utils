steps:
  - group: check
    job: link-url-chip-browser
    desc: the URL chip under Links writes the links as their addresses and back, and nothing shows through the chip row, in current Chromium at 393x852, 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/link_url_chip_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 9
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#520 search-whose-toggle-hint` in the browser engine: each press of the author filter leaves a
  # chip under it naming the state landed on, and hover/focus raises its tooltip, at 393x852 and
  # 1280x800. Measured on 2026-10-25: about 8s wall (the chip's real 1.5s wait at each size).
