steps:
  # `#1983 vibe-talk-all-view-send-flash` in the browser engine: sending in All, on the
  # newest line, with a slow post and (in the second walk) a live reply's re-read still
  # on the wire answered late from before the send, never replaces a message the reader
  # was looking at for a moment and then puts it back, and never moves the anchor row
  # by more than 3px, sampled at every animation frame, at 412x915 and 1280x800 in
  # light and dark.
  - group: check
    job: send-flash-browser
    desc: a send in All shows no different messages for a moment and moves the anchor by at most 3px, in current Chromium at 412x915 and 1280x800 in both schemes
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/send_flash_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 600
    cpu_timeout: 90
    hint:
      resources: {browser: 1}
      est_duration_s: 60
      classification: latency-bound
      rss_baseline_bytes: 1073741824
