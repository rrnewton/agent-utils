steps:
  - group: check
    job: collapsed-lines-browser
    desc: collapsed messages at the reader's 0 to 8 lines in Main, a thread, unpacked rows and on thread cards, by Ctrl/Cmd+( and Ctrl/Cmd+) and by the Settings slider, the reader's place kept, in current Chromium at 1280x800 and 393x852
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/collapsed_lines_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 720
    cpu_timeout: 90
    hint:
      resources: {browser: 1}
      est_duration_s: 30
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#482 thread-card-fit`, `#483 thread-card-read-style` in the browser engine, at 1280x800 and at
  # 393x852 by touch: a one-line thread card is one line tall with no reserved room under its words
  # while a long one still clamps at three, a short summary is whole at its own height, a fully
  # read card is drawn at a read message row's opacity and desaturation (back at full strength
  # under focus), Unpack unread greys its edge, Fold read folds the read run behind one
  # full-strength line and Hide read leaves the read cards out, and the card heading the open
  # thread is one fitted line. Served through Playwright's request routing, so it opens no port.
