steps:
  - group: check
    job: collapse-anchor-browser
    desc: collapsing a message with its top on screen, above it, and inside a giant, at 393x852 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/collapse_anchor_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 720
    cpu_timeout: 90
    hint:
      resources: {browser: 1}
      est_duration_s: 120
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#1251 scroll-single-owner`: every direct scroll write outside the loop owner (scrollkeep),
  # grouped by adoption path; enforcing for the paths already adopted (P1 keepers/footroom,
  # P2 placement, P3 collapse/fold, P5 shell keys, P6 user jumps, P7 composer/keyboard,
  # P8 legacy script, P9 reaction overlay).
