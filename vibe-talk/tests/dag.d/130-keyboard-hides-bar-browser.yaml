steps:
  - group: check
    job: keyboard-hides-bar-browser
    desc: both bars away while the on-screen keyboard is up and back as it goes or the box loses the focus, the reader's place kept and a slim Stop while reading, in current Chromium at 393x852 by touch and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/keyboard_hides_bar_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 8
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#1680 inline-reply-keyboard-clutter` in the browser engine, at 393x852 by touch with the
  # on-screen keyboard simulated as Chrome on Android lays it out (the viewport 336px shorter)
  # and at 1280x800 with a mouse: replying, exactly one Send stands (the reply's own, never
  # overlapped by the Send at the keyboard's top), the floating jump chips stand down with
  # Undo kept at the top, the reply's row is compact on one line with its helper text away,
  # and the keyboard going down brings the chips and the text back; in the main composer the
  # corner Send alone stands over the keys; on a desk none of it applies.
