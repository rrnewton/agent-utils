steps:
  - group: check
    job: documents-toolbar-browser
    desc: the Documents toolbar Downloaded/Starred pair beside the hamburger (placement order, both filters alone and combined with chips, keyboard and reload behaviour), against the real server (fake chat upstream) in current Chromium at 412x915 and 1280x800, dark and light
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/documents_toolbar_browser.py
    jobs_flag: ""
    deps: [build.release, setup.contract-tools]
    timeout: 480
    cpu_timeout: 120
    hint:
      resources: {browser: 1}
      est_duration_s: 90
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824
