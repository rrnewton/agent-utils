steps:
  # `#1899 vibe-talk-search-bucket-chips-pinned` in the browser engine: "lantern" over a
  # channel whose server copy holds hits in main and in threads; the bucket chips stay
  # under the search bar after the results scroll to the bottom, pressed told from
  # unpressed by filled ground, check and aria-pressed, and a new search stands the
  # extra chip back down, at 412x915 (keyboard open and closed) and 1280x800 in both schemes.
  - group: check
    job: search-bucket-pinned-browser
    desc: bucket chips stay under the search bar after scrolling to the bottom, pressed plainly told apart, in current Chromium at 412x915 and 1280x800 in both schemes, keyboard open and closed
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/search_bucket_pinned_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 30
      classification: latency-bound
      rss_baseline_bytes: 1073741824
