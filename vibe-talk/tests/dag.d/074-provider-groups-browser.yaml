steps:
  - group: check
    job: provider-groups-browser
    desc: the bar's channel picker grouped by chat service, stepped with Alt+Down/Up through CDP and restored after a reload, in current Chromium at 1280x800 and 375x812
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/provider_groups_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 6
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#402 who-is-who-channel-box` and `#401 hidden-channels-fold` in the browser engine at 1280x800 and a
  # 393x852 phone: Settings' Channels section with two channels and three hidden ones. Who is who is in the
  # channel box and follows its picker; the hidden channels are a fold headed "Hidden channels (3)", folded
  # and the last thing drawn in the section; opening it moves none of the boxes above it, a picker change
  # leaves it folded, and Show again works inside it. The fake-DOM suite lays nothing out, so only this
  # proves the fold is at the foot and moves nothing. Measured on 2026-10-21 outside dagrun at load 29:
  # about 4s wall, 1.4s CPU.
