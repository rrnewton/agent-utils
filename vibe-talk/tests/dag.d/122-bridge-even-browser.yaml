steps:
  - group: check
    job: bridge-even-browser
    desc: even bridge connectors with the owner's rows left-justified, and the dimmed pack triangle centred against its card with its rectangle clear of the bridge's line, in current Chromium at 393x852, 412x915, 768x1024 and 1280x800 in both schemes
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/bridge_even_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 720
    cpu_timeout: 90
    hint:
      resources: {browser: 1}
      preferred_inner_jobs: 4
      est_duration_s: 25

