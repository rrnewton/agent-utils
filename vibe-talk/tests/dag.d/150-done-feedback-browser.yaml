steps:
  - group: check
    job: done-feedback-browser
    desc: selected read ringed dashed grey and selected unread solid in the accent in both schemes, the moment of a Done and every Undo, reduced motion, a plain Undo chip on phones and a named one on a desk, and nothing floating over the message box at any scroll position, in current Chromium
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/done_feedback_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 720
    cpu_timeout: 90
    hint:
      resources: {browser: 1}
      est_duration_s: 40
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#244 elision-word-count` in the browser engine, in seven layouts — phones at 360 and 412px, at 80%
  # and 150% text, a 1280 desk, the widest reading column, two columns: every folded row's one label
  # claims no more words or characters than its clamp really hides, found by the rects of its
  # characters, on a line as wide as the text and at its size; a wall is labelled with at least half of
  # what it hides; a 300-character message says nothing on a desk; Chinese and a bare address are
  # counted in characters; a table the clamp draws whole says nothing, and a table over prose, a code
  # block and a list of short items say no more than they hide; a rich header's row holds with the
  # switch on and off. Served through Playwright's request routing, so it opens no port. Measured on
  # 2026-10-12: about 7s wall.
