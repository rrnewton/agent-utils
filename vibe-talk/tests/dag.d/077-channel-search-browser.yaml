steps:
  - group: check
    job: channel-search-browser
    desc: a Slack channel found by typing its name without the '#' into the real channel picker and the channel browser's search, and a slow first read counting its seconds, in current Chromium at 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/channel_search_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 8
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#229 desktop-two-column` in the browser engine: the layout button draws Main and the right column
  # side by side inside the window at 1440x900 and 1280x800, neither under 440px, the view picker
  # saying so and the width handle gone; `#281 view-keys`: the thread list chosen from the picker is the
  # right column across the window, its heading clear of the glass, and real Ctrl+2 and Ctrl+4 leave two
  # columns for All and come back; the right column's cards are one height, newest activity at the foot,
  # the summarised thread by its name and summary and the long question cut to three lines, still three
  # under the mouse and whole once a click highlights it (`#277 thread-card-focus`); a card's replies
  # button and a Main message's Thread(N) select a thread on the right under its name, each column scrolls
  # alone under the wheel over it, the X goes back to the cards, a 900px window is one column in the view
  # it was in and two again when widened, real keys (] Esc j -> [) move between the columns and through
  # the cards, and a phone's width draws neither the button nor the column. `#261 two-column-connectors`:
  # the links from Main's roots to their cards drawn for exactly the pairs on screen, touching their
  # boxes in their colours, the selected card's link pointing off screen, and a mouse resting on it
  # scrolling nothing (`#1144 scrollback-typing-jump`). `#262 search-load-older`: a search reads no
  # older page by itself, and its bounded walk back — Enter in two columns at 1280x800, a tap on a
  # 412x915 phone — finds older matches under a step back that holds still. Measured on 2026-10-13:
  # about 22s wall.
