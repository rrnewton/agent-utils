steps:
  - group: check
    job: mention-jump-browser
    desc: a mention in the Documents list lands its highlighted message in view and keeps it there while late reads, a live arrival, a reaction, history paging and summaries land, in current Chromium at 393x852 with touch and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/mention_jump_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 30
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#564 message-summary-toggle`, in the browser engine: the unpack walk's channel, one reply holding a
  # quote and a code block far wider than a phone, every summary failing. At 393x852, 412x915 and
  # 1280x800 the unpacked row says its failure in a small muted label and stays grey as Done, and
  # opened it keeps every card and row inside the list, the block scrolling in its own box.
