steps:
  # `#2426 vibe-talk-sparse-loading-program` R3 (owner request 383): a link to a message older than
  # what is held lands as an island with one around read (ten each way) and no step back, a box
  # standing at once where it lands; the step back from that island and Newest after it read as
  # they should. Counts and geometry, no wall-clock budget.
  - group: check
    job: link-island-browser
    desc: a link to a message far older than what is held lands with one around read and no step back, an island with a seam above the newest window, the step back from it holding the target within 1 px, and Newest after it with zero reads, in current Chromium at 412x915 by touch and 1280x800 (#2426)
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/link_island_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 600
    cpu_timeout: 120
    hint:
      resources: {browser: 1}
      est_duration_s: 40
      classification: latency-bound
      preferred_inner_jobs: 4
