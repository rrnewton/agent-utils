steps:
  # `#2285 vibe-talk-labels-browser-tapped-message-jumps` (owner rule 370): a tapped label
  # chip keeps the tapped row's top within 0.5 px in every frame from the tap to the settle:
  # two results with room above the rows (desk) or a floor under them (phone, keyboard down),
  # a long list, and room above reclaimed under a scrolling reader with no row moving, at
  # 412x915 (keyboard really open) and 1280x800. Condition waits only (#2077 backstop).
  - group: check
    job: label-chip-tap-browser
    desc: a tapped label chip keeps the tapped row's top within 0.5 px per frame (short lists with room above or a floor, a long list, room reclaimed while scrolling) in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/label_chip_tap_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 25
      classification: latency-bound
      rss_baseline_bytes: 1073741824
