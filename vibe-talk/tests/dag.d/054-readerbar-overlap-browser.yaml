steps:
  - group: check
    job: readerbar-overlap-browser
    desc: Sound and the cloud/device selector do not overlap and each is tappable in the phone reader bar, in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/readerbar_overlap_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 27
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#1717 vibe-talk-quote-reply-dismiss-x` in the browser engine: the dismiss X beside the
  # Quoted reply chip at 412x915 (device scale 2.6, touch), clearing the selection without
  # folding the expanded card or moving the list.
