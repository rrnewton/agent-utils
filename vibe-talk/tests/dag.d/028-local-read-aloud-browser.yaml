steps:
  - group: check
    job: local-read-aloud-browser
    desc: read-aloud with the local backend in current Chromium, phone and desktop, behaviour verdict only (tap-to-audible printed)
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/local_read_aloud_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 480
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 20
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#563 read-aloud-fallback-chain` in the browser engine: Settings displays the configured
  # voice order, a tap is heard, and the page names the fallback voice that spoke the block,
  # at 393x852 and on a desktop. The verdict is that behaviour only; the tap-to-audible time is
  # printed, and the old 5000 ms budget is an opt-in `--benchmark` outside the gate (#1250
  # vibe-talk-timing-robust, pattern #1248 fold-latency-behaviour-verdict).
