steps:
  - group: check
    job: live-pill-browser
    desc: the live pill and the search glass float over the channel's list with no reserved band at its head, in Main and in a thread, at any scroll position and as a thread lands, in current Chromium at a 412x915 phone in both schemes
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/live_pill_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 960
    cpu_timeout: 120
    hint:
      resources: {browser: 1}
      est_duration_s: 22
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#1711 vibe-talk-floating-chip-overlap` in the browser engine: at a 412x915 phone (device scale
  # 2.6) with both top chips up, the reload chip stacks under the live pill at the left, clear of a
  # Thread(N) chip even scrolled onto the pill's line, each control hittable at its centre; at the
  # foot the status toast stands clear of the last card's reaction chips, each hittable. At a
  # 1280x800 desk the two top chips still share one line.
