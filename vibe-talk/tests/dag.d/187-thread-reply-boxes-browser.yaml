steps:
  # `#2385 vibe-talk-thread-open-layout-first`: a thread's replies on their way stand as boxes from
  # the first packets. Every read the fake API answers is held until the walk releases it, so "before
  # the bodies" is an order of events, never a clock: the late count (the owner's case) draws the boxes
  # and reads the thread at once, an entry with the count known draws them in its first frame, the
  # first reply lands where its box stood, the rows hold through the fill, the status line speaks
  # once, and the kill switch brings the old behaviour back. S-t1: the thread's layout goes out
  # before the bodies' read and prices each box from its own reply (heights within 1 px of the
  # mirrored price), the re-price moving nothing. Phone (touch, dark) and desk (light).
  - group: check
    job: thread-reply-boxes-browser
    desc: a thread's missing replies stand as boxes before their bodies, priced one per reply by the thread's layout read sent before the bodies' read, the late count reads the thread at once, the rows hold through the re-price and the fill and the line speaks once, with the kill switch restoring the old behaviour, in current Chromium at 412x915 by touch and 1280x800 (#2385)
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/thread_reply_boxes_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 480
    cpu_timeout: 90
    hint:
      resources: {browser: 1}
      est_duration_s: 60
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824
