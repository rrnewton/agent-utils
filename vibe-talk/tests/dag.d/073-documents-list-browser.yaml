steps:
  - group: check
    job: documents-list-browser
    desc: the Documents list cards (one-line meta, mentions text link and pop-up, duplicate collapse, bottom-docked filter chips), against the real server (fake chat upstream) in current Chromium at 393x852 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/documents_list_browser.py
    jobs_flag: ""
    deps: [build.release, setup.contract-tools]
    timeout: 480
    cpu_timeout: 120
    hint:
      resources: {browser: 1}
      est_duration_s: 90
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#355 provider-grouped-channels` in the browser engine at 1280x800 and a 375x812 phone: with two chat
  # services the bar's channel picker holds one <optgroup> per service in configuration order, Alt+Down
  # and Alt+Up through CDP step across the groups in the order shown, a reload restores the channel
  # inside its group, Ctrl+K and a choice read it, and on the phone the picker stays inside the window.
  # The fake-DOM suite's <select> is a plain object, so only this proves a real picker's groups.
  # Measured on 2026-10-19 outside dagrun on a host at load 296: about 3s wall, 1.7s CPU.
