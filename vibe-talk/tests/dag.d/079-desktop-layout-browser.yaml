steps:
  - group: check
    job: desktop-layout-browser
    desc: Settings' head one quiet row (two on a phone) in reading and Tab order, and in two columns every row but the owner's across its column with the glass floating over the list, in current Chromium at 1280x800, 1920x1080, 2560x1080 and 393x852
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/desktop_layout_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 8
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#277 thread-card-focus` in the browser engine, at 1280x800 over the right column's cards with a mouse
  # and the keys, and at 412x915 over the Threads list by touch: every card contracted, the one under the
  # mouse too; a click or a tap highlights one, shown whole and not entered, and every other card's edge
  # and every other link turns the page's grey — by the colour Chromium computes and by the pixels a
  # screenshot holds there — the highlighted card's own staying in its thread's colour; its replies button
  # enters its thread, <- or Back comes out to it still highlighted, Esc puts the highlight out, and ->
  # enters the card the keys are on. `#281 view-keys`: then the phone's thread list from the view picker,
  # the same cards across the window, the channel's highlight on them and the others grey, each replies
  # button a thumb high; a tap highlights one, shown whole, its replies button opens the thread across the
  # window, and Back comes to the list. Measured on 2026-10-13: about 4s wall.
