steps:
  - group: check
    job: two-column-splitter-browser
    desc: dragging the two columns' separator resizes them with neither column's anchor row moving, clamps at 300px a column, resets on double-click, moves by arrow keys, and persists across a reload, in current Chromium at 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/two_column_splitter_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 25
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#1144 scrollback-typing-jump`: typing at the foot is followed, reading scrollback holds, and
  # hover scrolls neither column. Steps wait for the drawn place itself (`#1250
  # vibe-talk-timing-robust`); the hover rests stay dwells past the old glide's wait by design.
