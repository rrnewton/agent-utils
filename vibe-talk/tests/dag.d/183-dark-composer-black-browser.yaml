    job: dark-composer-black-browser
    desc: in dark every box the reader writes in (channel, thread, call, reply, quick reply, Discuss) is the message cards' black and its words and placeholder keep 4.5:1 on it, at rest, focused and with the keyboard up; light unchanged; system and forced themes, in current Chromium at 412x915 by touch and 1280x800 (#2294)
