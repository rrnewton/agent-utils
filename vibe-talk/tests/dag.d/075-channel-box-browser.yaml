steps:
  - group: check
    job: channel-box-browser
    desc: Settings' channel section in current Chromium at 1280x800 and 393x852, Who is who in the channel box following its picker, and the hidden channels a folded fold at its foot that moves nothing above it
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/channel_box_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 360
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 6
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#1781 vibe-talk-first-run-welcome-channel-default` in the browser engine at 412x915 (scale
  # 2.6) and 1280x800, light and dark, the keyboard emulated as a visualViewport shrink on the
  # phone with the Discuss half-pane open: a fresh sign-in meets the Welcome once and dismisses
  # onto the Channel, a reload and a saved Voice choice meet neither surprise, the Welcome
  # re-opens from Settings and Help, the no-channel Welcome is the guided config setup whose
  # Check again lands on the channel once configured, and `?v=docs` still wins.
