steps:
  - group: check
    job: thread-line-browser
    desc: the line from a thread's root to its card runs beside the thread's rows and never over them, and the owner's rows stay partial width, in current Chromium at 1000x800, 1280x800 in both schemes and 1920x1080, and at 393x852 by touch
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/thread_line_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 480
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 20
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#386 hide-empty-messages` in the browser engine, at 1280x800 with a mouse and at 393x852 by touch, in
  # the dark scheme and the light: with the switch on, its default, no empty message is drawn in All, in
  # Main or in a thread on the right, the headings count only what is drawn and a thread's card does not
  # count an empty reply unread, while a file posted with no words and a message with only a reaction
  # are drawn; Settings > Messages > Empty messages, beside Mark-read automatically, turned off draws
  # every empty message again, kept across a reload, and on hides them again.
  # `#1861 vibe-talk-dark-bar-icon-invisible`: the thread picker's glyph contrasts with its
  # button under every Appearance choice and device scheme, in current Chromium.
