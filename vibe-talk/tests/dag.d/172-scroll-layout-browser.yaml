steps:
  # `#2034 vibe-talk-scroll-layout-reads` in the browser engine: a PageDown screenful
  # over an 816-message channel reads at most a few hundred layouts (from ~5,000), the
  # jump is offered and lands, and a burst of scroll events pays no whole-list pass.
  # DISABLED from gating (`disabled-optin`, #2077 vibe-talk-browser-checks-hot-host; owner
  # rule 346): the layout/paint/write counts are deterministic, but "at most 2 long tasks"
  # is a 50ms wall-duration verdict — CPU starvation stretches a task past the threshold
  # without more page work (3 measured in load proof at 71-82% host load). It stays runnable
  # by hand / validate --include-disabled; return when the long-task evidence no longer
  # decides the verdict and the check is proved under load.
  - group: check
    job: scroll-layout-browser
    desc: scrolling a loaded channel reads the visible band only, and the jump lands, in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page, disabled-optin]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/scroll_layout_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 30
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824
