steps:
  - group: check
    job: read-aloud-blocks-browser
    desc: a long message read block by block in current Chromium — blocks and sentences in order, jumps, media keys, pause and resume, and the strip's geometry — with audio-clock boundary gaps printed (budgets benchmark-only)
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/read_aloud_blocks_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 480
    cpu_timeout: 60
    hint:
      # One browser slot: since #1250 no audio-clock gap in this step decides a verdict, so
      # sibling browser steps cannot starve it the way they starved the old boundary budgets
      # (it held all eight slots then).
      resources: {browser: 1}
      # ~44 s solo on this host class at #1250 once the three --benchmark control profiles
      # left the gate (was 80 s with them), ~8 CPU-seconds.
      est_duration_s: 45
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#540 read-aloud-desktop` in the browser engine: a message read aloud from every view — Main, All,
  # the thread list's cards, unpacked rows and Main rows, one thread, two columns — by the agent's voice
  # and the device's; the light on the drawn row, the blocks counted in order; silence stops a read.
  # The verdict is that behaviour (`#1250 vibe-talk-timing-robust`); the block's lit time is printed,
  # and its old pace budget is an opt-in `--benchmark` outside the gate.
