steps:
  - group: check
    job: documents-layout-browser
    desc: the Documents reader layout (bounded centred column, grip gate, zebra rows, heading rules, menu gating), against the real server (fake chat upstream) in current Chromium at 393x852 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/documents_layout_browser.py
    jobs_flag: ""
    deps: [build.release, setup.contract-tools]
    timeout: 480
    cpu_timeout: 120
    hint:
      resources: {browser: 1}
      est_duration_s: 90
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824

  # `#1544 documents-desktop-control-bar` against the real server binary: the
  # centred Reader box, Fetch/Outline exclusivity, and centred clamped popups.
