steps:
  - group: check
    job: documents-scrubber-browser
    desc: section numbers on the document and the two/three-row navigator over a large synthetic document, against the real server (fake chat upstream) in current Chromium at 393x852 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/documents_scrubber_browser.py
    jobs_flag: ""
    deps: [build.release, setup.contract-tools]
    timeout: 480
    cpu_timeout: 120
    hint:
      resources: {browser: 1}
      est_duration_s: 90
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#1847 vibe-talk-slack-communication-audit`: the page only talks to its own
  # server — every request recorded in Chromium against the real server binary.
