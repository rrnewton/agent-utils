steps:
  # `#1920 vibe-talk-main-thread-switch-and-scroll-lag` in the browser engine: switching
  # Main -> thread and back over a 2000-message channel with a 120-reply thread reads a
  # bounded, O(1) number of layouts per switch (never one per row), the thread view shows
  # the thread's own rows, the reader's place is kept across the round trip, and a scroll
  # burst stays bounded too, at 412x915 and 1280x800.
  - group: check
    job: thread-switch-fast-browser
    desc: switching Main to thread and back reads bounded layouts over a big channel, keeps the reader's place, and scrolling stays bounded, in current Chromium at 412x915 and 1280x800
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && VIBE_TALK_WEB_ROOT=$PWD/target/web python3 tests/thread_switch_fast_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools, build.page]
    timeout: 360
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 30
      classification: latency-bound
      preferred_inner_jobs: 4
      rss_baseline_bytes: 1073741824
