steps:
  - group: check
    job: rich-headers-browser
    desc: rich headers laid out in current Chromium at a 412x915 Android viewport and a 1280x800 desk, one column and two
    labels: [validation-vibe-talk, validation-vibe-talk-page]
    cmd: cd vibe-talk && python3 tests/rich_headers_browser.py
    jobs_flag: ""
    deps: [setup.contract-tools]
    timeout: 240
    cpu_timeout: 30
    hint:
      resources: {browser: 1}
      est_duration_s: 5
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#7 read-aloud-latency` in the browser engine: a prepared read's audio starts while it arrives
  # at speaking pace, a switch stops the queued audio and a switch, pause/resume and a stop reach
  # their states, and only a read heard to its end is archived (`#1250 vibe-talk-timing-robust`).
  # Tap-to-audible and speech-onset times are printed; their budgets and the `<audio src>` negative
  # control run only under `--benchmark`, outside the gate. A read that opens with silence reports
  # speech after its first frame (`#191 read-aloud-first-lag`).
