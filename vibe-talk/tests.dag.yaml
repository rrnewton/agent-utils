      --test-reporter=tap
      --test-reporter-destination="${AGENT_UTILS_CASE_TIMING_DIR:-target/case-timings}/node-${DAGRUN_OUTER_RUN:-vibe-talk.test.page-0}.tap"
      tests/js/voice_page.test.mjs
    jobs_flag: ""
    timeout: 600
    cpu_timeout: 600
    hint:
      est_duration_s: 60
      classification: cpu-bound
      # node is one thread of JavaScript plus its collector's.
      preferred_inner_jobs: 2
      rss_baseline_bytes: 1610612736

