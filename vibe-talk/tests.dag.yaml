  # `#269 approval-card-inline` in the browser engine: the send card as the next message, in the list
  # on the call's view and the channel and docked on Settings, Send's centre at least 0.62 of the way
  # down a 393x852, 360x780 and 375x667 phone in every run (one and thirty rows, banner up or gone,
