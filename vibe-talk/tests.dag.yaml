      est_duration_s: 4
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#378 live-reactions` in the browser engine: a reaction pushed as a live update appears under
  # its row on the open page with no reload, and its removal takes the strip away.
  - group: check
    job: live-reactions-browser
    desc: a live reaction update drawn on the open page in current Chromium at a 412x915 Android viewport
    labels: [validation-vibe-talk]
