# vibe-talk's test suites, as a DAG that dagrun can box.
#
# WHY THIS EXISTS
#
# The old tool-local validation ran these steps one after another, unboxed, with no ceiling on what
# any of them could consume. That was tolerable while every suite was cheap. It stopped being tolerable the day a
# screenshot server was found still running SIX DAYS after the run that started it, holding a port,
# reparented to init, with its own configuration directory long deleted. A run that cannot bound
# what it starts cannot clean up after what it starts.
#
# dagrun is this repository's own answer to exactly that: per-step wall and CPU timeouts, memory
# limits, and process-tree teardown enforced inside nested cgroups. A step that hangs is reaped
# with its whole descendant tree, whether or not the step remembered to trap a signal.
# Repository-level `make validate` now includes this fragment in that shared boxed graph; the
# tool-local `make -C vibe-talk validate` remains an explicit unboxed escape hatch.
#
# WHAT THE SHAPE SAYS
#
# The six cheap checks are independent of each other and of the build, so they run concurrently
# and one failing does not hide the others. Everything that needs a compiled binary hangs off
# `build.release`, which is stated once rather than paid for per step.
#
# THE BROWSER CAP IS THE POINT OF THE `resource_caps` BLOCK. Playwright is the only genuinely
# expensive thing here — a real Chromium per run — and a pile of them at once on a laptop is how a
# test suite becomes the reason the laptop is unusable. `browser: 4` is a semaphore: any number of
# steps may DECLARE the resource, and at most four hold it at a time.
#
# It was 1 until `#474 browser-lane-critical-path` (2026-10-23). The browser steps then ran one after
# another, and their sum was nearly all of a 2470s gate. They are latency-bound, not
# CPU-bound — together about 890s of CPU in those 2470s, most boxed to one core — so four side by side
# take about a quarter of the time on any machine with four cores to spare. What makes that safe:
# each check serves the page and its fake API on a port the kernel picks (bound to port 0, or for
# the two that start the real server, send-order and pwa-installability, probed free just before),
# launches Chromium in a fresh temporary profile, and keeps its state in temporary directories. The
# fixed ports are the screenshot harness's (VIBE_TALK_SHOTS_PORT and the two above it), and it is
# the only step that uses them; it also writes its PNGs under vibe-talk/debug/screenshots/, a new
# stamped directory each run. The lane at 1 and at 4 was compared check by check.
#
# HOW TO RUN IT
#
#   dagrun run --dag vibe-talk/tests.dag.yaml
#
# from the repository root, which is the working directory every `cmd` below assumes. `make
# validate-boxed` in vibe-talk/ is the same thing with the paths already right.

description: vibe-talk fmt, lint, unit, PWA, offline-cache, page and screenshot suites, boxed

resource_caps:
  # A real browser. Four at a time, however many steps ask for it. validation/timeline.dag.yaml
  # states the same number: the composed graph refuses two fragments that disagree.
  browser: 4

steps:
  # ---- the cheap gates, which need nothing built ------------------------------------------------
  - group: check
    job: fmt
    desc: rustfmt, in check mode
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && cargo fmt --all -- --check
    jobs_flag: ""
    cpu_timeout: 60
    hint:
      est_duration_s: 5
      classification: light
      rss_baseline_bytes: 268435456

  - group: check
    job: clippy
    desc: clippy over every target, warnings denied
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && cargo clippy --all-targets --locked -- -D warnings
    jobs_flag: ""
    jobs_env: CARGO_BUILD_JOBS
    cpu_timeout: 900
    hint:
      est_duration_s: 120
      classification: cpu-bound
      preferred_inner_jobs: 8
      # Clippy holds the whole crate graph. This is the step most likely to be the memory high
      # water mark of the run, and the one worth a real number rather than a default.
      rss_baseline_bytes: 3221225472

  - group: check
    job: scripts
    desc: strict typing and no explicit Any in the Python operator tools
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && make scripts-check
    jobs_flag: ""
    cpu_timeout: 120
    hint:
      est_duration_s: 5
      classification: light
      rss_baseline_bytes: 536870912

  # The generated browser contract matches the schema, and voice.js type-checks against it. The
  # schema's own freshness against the Rust types is a `cargo test` in `test.unit`.
  # The contract check runs the generator's tools (Ajv, TypeScript) from contract/node_modules, so
  # it depends on the step that installs them from contract/package-lock.json rather than on
  # whoever last ran `npm ci` in this checkout. A repeat run with the same lockfile does nothing.
  - group: setup
    job: contract-tools
    desc: install the contract generator's lockfile-pinned tools
    labels: [validation-vibe-talk]
    cmd: scripts/provision-node-packages vibe-talk/contract
    jobs_flag: ""
    timeout: 600
    cpu_timeout: 300
    hint:
      est_duration_s: 2
      classification: latency-bound
      rss_baseline_bytes: 536870912

  - group: check
    job: contract
    desc: generated browser contract is current, and tsc --checkJs over voice.js
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && make contract-check typecheck
    jobs_flag: ""
    deps: [setup.contract-tools]
    cpu_timeout: 120
    hint:
      est_duration_s: 8
      classification: light
      rss_baseline_bytes: 536870912

  # The physical Android run is opt-in. Its evaluator is not: silence and wrong-language speech
  # are negative controls here, requiring no phone, browser, capture device or STT service.
  - group: check
    job: android-speech-self-test
    desc: offline controls for the Android rendered-speech evaluator
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 scripts/android-device-speech.py --self-test
    jobs_flag: ""
    cpu_timeout: 30
    hint:
      est_duration_s: 2
      classification: light
      rss_baseline_bytes: 268435456

  # The live runner opens fresh provider sessions and may consume paid time. Its metric and output
  # controls are pure and deterministic, so validate those without dialing any endpoint.
  - group: check
    job: voice-read-acceptance-self-test
    desc: offline controls for the provider-neutral long-read acceptance runner
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 scripts/voice-read-acceptance.py --self-test
    jobs_flag: ""
    cpu_timeout: 30
    hint:
      est_duration_s: 1
      classification: light
      rss_baseline_bytes: 268435456

  # `#354 live-relay-check`. The live check makes real calls and is never run here; its verdict logic,
  # on synthetic frame logs, is pure and offline.
  - group: check
    job: live-relay-check-self-test
    desc: offline verdict controls for the opt-in live check of relays during a call
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 scripts/live-relay-check.py --self-test
    jobs_flag: ""
    cpu_timeout: 30
    hint:
      est_duration_s: 1
      classification: light
      rss_baseline_bytes: 268435456

  # The screenshot harness's own controls: the capture judge and its PNG decoder against frames it
  # builds itself, a blank frame refused on the walk's path, and the scene table. Offline, with no
  # browser and no server, where `shots.screenshots` needs both; it was in no step until
  # `test-time-vibe-talk`, which found it broken by a test double the walk's driver had outgrown.
  - group: check
    job: screenshots-self-test
    desc: offline controls for the screenshot harness's capture judge, PNG decoder and scene table
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 scripts/screenshots.py --self-test
    jobs_flag: ""
    timeout: 60
    cpu_timeout: 30
    hint:
      est_duration_s: 2
      classification: light
      rss_baseline_bytes: 268435456

  - group: check
    job: live-hint-adapter-self-test
    desc: offline framing, retry, privacy, and child-cleanup controls for live change hints
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 scripts/live-hint-adapter.py --self-test
    jobs_flag: ""
    timeout: 30
    cpu_timeout: 15
    hint:
      est_duration_s: 2
      classification: light
      rss_baseline_bytes: 268435456

  # Chrome's own installability verdict. Unlike the fake-DOM suite, this exercises manifest
  # parsing, icon loading, secure-origin rules and the selected display mode in the browser engine.
  # Against the real server since `#302 root-is-the-app`, because what it asks about is the server's:
  # the app at / is installable, the manifest's id still names the app installed from /voice, and
  # /voice?x=1#y is a 302 to /?x=1#y, query and fragment kept, inside the scope.
  - group: check
    job: pwa-installability
    desc: current Chromium CDP installability check with an Android viewport, at / and from /voice, against the real server
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/pwa_installability.py
    jobs_flag: ""
    deps: [build.release]
    timeout: 60
    cpu_timeout: 30
    hint:
      resources: {browser: 1}
      est_duration_s: 5
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#225 enter-to-send` in the browser engine: real keys in the reply box. With the default, Shift+Enter
  # is a new line and Enter posts the reply; with "Enter to send" turned off in Settings (its hint naming
  # the key that sends, kept across a real reload), Enter is a new line and posts nothing, and Ctrl+Enter
  # posts. A step of its own, not another walk in offline-cache-browser, whose CPU is near its cap.
  # Measured on 2026-10-08: about 2s wall.
  - group: check
    job: enter-to-send-browser
    desc: Enter in the reply box sends by default and is a new line with Enter to send off, in current Chromium
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/enter_to_send_browser.py
    jobs_flag: ""
    timeout: 60
    cpu_timeout: 30
    hint:
      resources: {browser: 1}
      est_duration_s: 3
      classification: latency-bound
      rss_baseline_bytes: 536870912

  # `#457 settings-server-side` in the browser engine, on two devices at once: one seeds the
  # server from its local choice, the other takes that choice on load, and a change on one
  # converges on the still-open other from the live stream, while a Screen and keys choice
  # never leaves its device. Measured on 2026-10-23: about 6s wall.
  - group: check
    job: settings-sync-browser
    desc: two devices share one server settings document and converge live, in current Chromium
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/settings_sync_browser.py
    jobs_flag: ""
    timeout: 120
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 6
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#369 pairing-link` in the browser engine: a fresh phone-sized browser opens a pairing link, the
  # code leaves the address and is redeemed once in a request body without a bearer token, the token is
  # stored and the main screen comes up; a second fresh browser opening the same link is told it expired
  # or was already used. Measured on 2026-10-19: about 3s wall.
  - group: check
    job: pairing-link-browser
    desc: a pairing link signs a fresh browser in once and leaves no code in the address, in current Chromium
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/pairing_link_browser.py
    jobs_flag: ""
    timeout: 60
    cpu_timeout: 30
    hint:
      resources: {browser: 1}
      est_duration_s: 4
      classification: latency-bound
      rss_baseline_bytes: 536870912

  # `#18 offline-message-cache` in the browser engine: saved rows drawn across a real reload before
  # the network answers, one newest-page read, local view switches, a real fetch failure, sign-out
  # clearing, empty Cache Storage and no service worker. `#32 freshness-pill-overlap`: refreshing,
  # offline and failed, the pill clear of the view tabs and the list's header, #scroll-area unmoved,
  # and a scrolled reader held in place as the pill comes and goes.
  - group: check
    job: offline-cache-browser
    desc: saved-message snapshot and a read-scope sign-in in current Chromium at 412x915 and 360x800 Android viewports and a 1280x800 desk
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/offline_cache_browser.py
    jobs_flag: ""
    # The walk has grown with every page feature it checks (search bar, Pinned, Links and their kinds,
    # tiles, the desktop dock, reply arrows) and measured 70-75 s wall and 42-46 s of CPU on a loaded
    # host on 2026-10-08, against the old 90 s / 45 s — so a passing run was killed for its CPU. The
    # budgets are a backstop against a hung browser, not a speed target: about twice the measurement.
    # With the gathered-replies walk (`#214 reply-arrow`, `#215 reply-coalesce`) a passing run on the
    # same host measured 155 s wall and 90 s of CPU, against 180 s / 100 s.
    timeout: 320
    cpu_timeout: 180
    hint:
      resources: {browser: 1}
      est_duration_s: 155
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#219 emoji-reactions` in the browser engine: each message's reaction strip under its text,
  # inside its row and the screen, clear of the row's buttons and links, the thread root's reply count
  # below it, and each count legible, at two phone widths and a desk, in the dark and light schemes.
  - group: check
    job: reactions-browser
    desc: emoji reaction strips laid out in current Chromium at 412x915 and 360x800 Android viewports and a 1280x800 desk
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/reactions_browser.py
    jobs_flag: ""
    timeout: 60
    cpu_timeout: 30
    hint:
      resources: {browser: 1}
      est_duration_s: 4
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#378 live-reactions` in the browser engine: a reaction pushed as a live update appears under
  # its row on the open page with no reload, and its removal takes the strip away.
  - group: check
    job: live-reactions-browser
    desc: a live reaction update drawn on the open page in current Chromium at a 412x915 Android viewport
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/live_reactions_browser.py
    jobs_flag: ""
    timeout: 60
    cpu_timeout: 30
    hint:
      resources: {browser: 1}
      est_duration_s: 4
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#323 slack-system-bots` in the browser engine: a Slack welcome bot alone in a channel drawn as
  # another bot, its name and "(bot)" on screen, set in and coloured as a colleague is, with no coding
  # agent unless one is named; and a named coding agent drawn as the agent beside it.
  - group: check
    job: system-bots-browser
    desc: Slack system bots drawn as bots, and a named coding agent as the agent, in current Chromium at a 412x915 Android viewport and a 1280x800 desk
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/system_bots_browser.py
    jobs_flag: ""
    timeout: 60
    cpu_timeout: 30
    hint:
      resources: {browser: 1}
      est_duration_s: 4
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#320 slack-edited-mark` in the browser engine: the "(edited)" after an edited row's time, on one
  # line inside the meta line and after the time, clear of the row's buttons and uncovered, in the
  # time's ink and size, at two phone widths and a desk, in the dark and light schemes.
  - group: check
    job: edited-mark-browser
    desc: the edited mark laid out in current Chromium at 412x915 and 360x800 Android viewports and a 1280x800 desk
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/edited_mark_browser.py
    jobs_flag: ""
    timeout: 60
    cpu_timeout: 30
    hint:
      resources: {browser: 1}
      est_duration_s: 5
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#427 server-thread-hues` in the browser engine: two browser contexts — two devices — each
  # remembering the same six threads in different colours, both drawn in the colours the first
  # device offered the server and the server took, and a reload of the second drawing them still.
  - group: check
    job: server-thread-hues-browser
    desc: two browser contexts drawing the same threads in the server's colours in current Chromium at a 1280x800 desk
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/server_thread_hues_browser.py
    jobs_flag: ""
    timeout: 120
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 15
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#242 rich-headers` in the browser engine: each headed row's tag, title and time drawn whole —
  # beside the time and the buttons where the list is wide enough, as the row's first line where it
  # is not — the words they restate hidden and every one of them in the header, a combined row's
  # second message as written, the ⋯ menu over the row below, and the Settings switch drawing every
  # first line as written across a reload, at a phone and a desk, in one column and two.
  - group: check
    job: rich-headers-browser
    desc: rich headers laid out in current Chromium at a 412x915 Android viewport and a 1280x800 desk, one column and two
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/rich_headers_browser.py
    jobs_flag: ""
    timeout: 60
    cpu_timeout: 30
    hint:
      resources: {browser: 1}
      est_duration_s: 5
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#7 read-aloud-latency` in the browser engine: a prepared read audible within a second of the
  # tap while its audio arrives at speaking pace, a switch and a stop closing the response, and
  # only a read heard to its end archived. The `<audio src>` control must take seconds. A read that
  # opens with silence reports when speech began as well (`#191 read-aloud-first-lag`).
  - group: check
    job: read-aloud-browser
    desc: read-aloud tap to audible in current Chromium, with an <audio> negative control
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/read_aloud_browser.py
    jobs_flag: ""
    timeout: 90
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 16
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#376 read-aloud-blocks` in the browser engine: a long message walked block by block against a
  # voice with one session that speaks at speaking pace -- the block lit and counted, a tap on another
  # block jumping there, Previous and Next, the media keys, and each boundary no longer than the
  # voice's own first-audio wait (none where it generates ahead). The control's slow first audio
  # must show as a gap, at a phone and a desk.
  - group: check
    job: read-aloud-blocks-browser
    desc: a long message read block by block in current Chromium, with boundary gaps measured on the audio clock and a slow-voice negative control
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/read_aloud_blocks_browser.py
    jobs_flag: ""
    timeout: 150
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 40
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#540 read-aloud-desktop` in the browser engine: a message read aloud from every view — Main, All,
  # the thread list's cards, unpacked rows and Main rows, one thread, two columns — by the agent's voice
  # and the device's, each with a clock this check reads; the light on the drawn row; silence stops a read.
  - group: check
    job: read-aloud-views-browser
    desc: reading aloud from every view by both voices in current Chromium at 1280x800, audio started and the light on the message read, and a silent voice stopping the read unarchived
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/read_aloud_views_browser.py
    jobs_flag: ""
    timeout: 180
    cpu_timeout: 60
    hint:
      resources: {browser: 1}
      est_duration_s: 45
      classification: latency-bound
      rss_baseline_bytes: 1073741824

