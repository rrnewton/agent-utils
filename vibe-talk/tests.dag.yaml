  # `#277 send-order` in the browser engine, against the real server binary and its real provider
  # client: a mock Google Chat bridge on loopback fails A at once; B waits behind A, saying so, and
  # the bridge never sees it; A goes again under the same nonce and lands, then B; across a real
  # reload a message still waits behind the one before it, and Retry on that one lands both, in
  # order; Dismiss on a failing message lets the next go; a slow bridge is given one post at a time,
  # in order; and a post whose caller hangs up mid-post still lands before the next one reaches the
  # bridge. It starts the release binary, so it hangs off the build; the server and the bridge are
  # its own, on free loopback ports, and stopped with it. Measured on 2026-10-13: about 14.3s wall,
  # most of it the page's own 3 s wait before A goes again, a 4 s watch that a reload sends nothing,
  # and the slow bridge's own 0.8 s per post and 2.5 s on the post whose caller hung up.
  - group: check
