  # `#269 approval-card-inline` in the browser engine: the send card as the next message, in the list
  # on the call's view and the channel and docked on Settings, Send's centre at least 0.62 of the way
  # down a 393x852, 360x780 and 375x667 phone in every run (one and thirty rows, banner up or gone,
  # short and long draft), uncovered and wholly on screen, and both buttons held when it appears;
  # then Send freezes it into the transcript (`#270 voice-transcript-markers`), the claim of its send
  # follows the commit, and a reload restores the same card. Docked under Settings the card never
  # scrolls as a whole: folded and after More, where it goes, its status and both buttons stay on
  # screen, on the three phones and at 667x375 and 375x330. At 1280x800 in two columns the card stays
  # wholly above a reply open at the left column's foot, its Send outlined beside a reply in either
