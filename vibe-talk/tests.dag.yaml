# vibe-talk's test suites, as a DAG that dagrun can box.
#
# WHY THIS EXISTS
#
# The old tool-local validation ran these steps one after another, unboxed, with no ceiling on what
# any of them could consume. That was tolerable while every suite was cheap. It stopped being tolerable the day a
# screenshot server was found still running SIX DAYS after the run that started it, holding a port,
# reparented to init, with its own configuration directory long deleted. A run that cannot bound
# what it starts cannot clean up after what it starts.
#
# dagrun is this repository's own answer to exactly that: per-step wall and CPU timeouts, memory
# limits, and process-tree teardown enforced inside nested cgroups. A step that hangs is reaped
# with its whole descendant tree, whether or not the step remembered to trap a signal.
# Repository-level `make validate` now includes this fragment in that shared boxed graph; the
# tool-local `make -C vibe-talk validate` remains an explicit unboxed escape hatch.
#
# WHAT THE SHAPE SAYS
#
# The six cheap checks are independent of each other and of the build, so they run concurrently
# and one failing does not hide the others. Everything that needs a compiled binary hangs off
# `build.release`, which is stated once rather than paid for per step.
#
# THE BROWSER CAP IS THE POINT OF THE `resource_caps` BLOCK. Playwright is the only genuinely
# expensive thing here — a real Chromium per run — and a pile of them at once on a laptop is how a
# test suite becomes the reason the laptop is unusable. `browser: 8` is a semaphore: any number of
# steps may DECLARE the resource, and at most eight hold it at a time.
#
# It was 1 until `#474 browser-lane-critical-path` (2026-10-23). The browser steps then ran one after
# another, and their sum was nearly all of a 2470s gate. They are latency-bound, not
# CPU-bound — together about 890s of CPU in those 2470s, most boxed to one core — so four side by side
# take about a quarter of the time on any machine with four cores to spare. What makes that safe:
# each check serves the page and its fake API on a port the kernel picks (bound to port 0, or for
# the two that start the real server, send-order and pwa-installability, probed free just before),
# launches Chromium in a fresh temporary profile, and keeps its state in temporary directories. The
# screenshot harness's server and mock take 18091 to 18093, or, when any of those is held or claimed
# by another run, three free ports the kernel picks: until #887 vibe-talk-screenshots-port a held
# default failed the whole run. Each run claims its ports for as long as it runs, so the screenshot
# shards and another checkout's gate never pick the same ones; the steps name no port, because a
# fixed one per shard collided whenever two gates photographed at once (#1037 shots-port-collision). It also writes its PNGs under
# vibe-talk/debug/screenshots/, a new stamped directory each run. The lane at 1 and at 4 was compared check by check.
#
# It went from 4 to 8 on 2026-11-07: two paired page-only runs on a 316-core host took 869/840 s at 4
# and 500/450 s at 8 (-42%/-46%), with no failed step at either cap, the cap-8 runs starting at equal
# or higher load. The timing checks that hold every slot still run alone among browsers.
#
# DISABLED UNTIL ROBUST (#1250 vibe-talk-timing-robust; owner reply 346, 2026-11-10: tests
# that are real-time-sensitive leave gating until they are fast, high-signal and robust on a
# hot machine). Steps labelled `disabled-optin` below judge frame, scroll or audio-clock
# timing, so `scripts/validate.py` excludes them from every default and `--all` run and
# names them as skipped; `--include-disabled` (or AGENT_UTILS_INCLUDE_DISABLED=1) runs them
# on demand, and a direct dagrun run of this fragment still runs them (the label is inert
# here). Disabled at filing: check.fold-steps-browser, check.scroll-stability-browser,
# check.typing-scroll-browser, check.read-pause-reply-browser, of which fold-steps,
# typing-scroll, read-pause-reply and (under #1251, naming #1250) scroll-stability
# have since returned behaviour-only.
# check.offline-cache-phone-browser was quarantined under the same label on 2026-11-11 after
# its second gate red and has since returned on the same proof bar (20/20 saturated runs at
# the phone and desktop profiles; tracking is #1250's Notes). check.scroll-soak-browser is
# disabled under the same label since 2026-11-15 (#1589 scroll-soak-load-flake). Each returns only as a
# behaviour-only check proved under load (#1248
# fold-latency-behaviour-verdict is the pattern; fold-latency, keyboard and
# keyboard-hides-bar stay enabled under it).
#
# HOW TO RUN IT
#
#   dagrun run --dag vibe-talk/tests.dag.yaml
#
# from the repository root, which is the working directory every `cmd` below assumes. `make
# validate-boxed` in vibe-talk/ is the same thing with the paths already right.

description: vibe-talk fmt, lint, unit, PWA, offline-cache, page and screenshot suites, boxed

resource_caps:
  # A real browser. Eight at a time, however many steps ask for it. validation/timeline.dag.yaml
  # states the same number: the composed graph refuses two fragments that disagree.
  browser: 8

include:
  # One file per check under tests/dag.d/ (#1891 vibe-talk-dag-append-conflicts):
  # every lane that adds a check adds ONE new file here (next free
  # number, `<NNN>-<job>.yaml`, plus `<NNN>-<job>.mk` when it needs a
  # make target) instead of appending to a file every other lane is
  # also appending to. The directory include loads them in file-name
  # order under this fragment's own namespace, so the compiled plan is
  # exactly the steps in number order.
  - path: tests/dag.d
    namespace: ""

steps: []
