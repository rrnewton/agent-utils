  # on the line above it, on one line at 393 and with nothing off the screen at 360 (`#270`), and on
  # the channel the card arriving, Send and the box taking back its room leave a reader up the list on
  # their row within a pixel and one at the foot there (`#280 scroll-stability`). At 393x852 and
  # 1280x800 the thread list (`#281 view-keys`): Cmd/Ctrl+3 and +4 pressed on the card's own buttons
  # post and withdraw nothing, the card docked under the cards, which stay at their foot above it, whole
  # on screen with Send at a thumb's reach, back at the foot of Main in two columns, and a draft arriving
  # there moving neither a reader at the cards' foot nor one up them; and back from the list, a reader
  # at All's foot at it again with Send on screen, one 100 or 225px up All and one 100 to 380px up Main
  # on their row; and with no card up as the list comes, a draft arriving under it leaving a reader 40
  # or 100px up Main on their row behind the cards and back, and with none at all, one 100px up All on
  # theirs (`#280`); and at 1280x800 a reader 60 to 260px up the list's cards, the card docked under them,
