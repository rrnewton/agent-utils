# vibe-talk's test suites, as a DAG that dagrun can box.
#
# WHY THIS EXISTS
#
# The old tool-local validation ran these steps one after another, unboxed, with no ceiling on what
# any of them could consume. That was tolerable while every suite was cheap. It stopped being tolerable the day a
# screenshot server was found still running SIX DAYS after the run that started it, holding a port,
# reparented to init, with its own configuration directory long deleted. A run that cannot bound
# what it starts cannot clean up after what it starts.
#
# dagrun is this repository's own answer to exactly that: per-step wall and CPU timeouts, memory
# limits, and process-tree teardown enforced inside nested cgroups. A step that hangs is reaped
# with its whole descendant tree, whether or not the step remembered to trap a signal.
# Repository-level `make validate` now includes this fragment in that shared boxed graph; the
# tool-local `make -C vibe-talk validate` remains an explicit unboxed escape hatch.
#
# WHAT THE SHAPE SAYS
#
# The six cheap checks are independent of each other and of the build, so they run concurrently
# and one failing does not hide the others. Everything that needs a compiled binary hangs off
# `build.release`, which is stated once rather than paid for per step.
#
# THE BROWSER CAP IS THE POINT OF THE `resource_caps` BLOCK. Playwright is the only genuinely
# expensive thing here — a real Chromium per run — and two of them at once on a laptop is how a
# test suite becomes the reason the laptop is unusable. `browser: 1` is a semaphore: any number of
# steps may DECLARE the resource, and at most one holds it at a time.
#
# HOW TO RUN IT
#
#   dagrun run --dag vibe-talk/tests.dag.yaml
#
# from the repository root, which is the working directory every `cmd` below assumes. `make
# validate-boxed` in vibe-talk/ is the same thing with the paths already right.

description: vibe-talk fmt, lint, unit, PWA, offline-cache, page and screenshot suites, boxed

resource_caps:
  # A real browser. One at a time, however many steps ask for it.
  browser: 1

steps:
  # ---- the cheap gates, which need nothing built ------------------------------------------------
  - group: check
    job: fmt
    desc: rustfmt, in check mode
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && cargo fmt --all -- --check
    jobs_flag: ""
    cpu_timeout: 60
    hint:
      est_duration_s: 5
      classification: light
      rss_baseline_bytes: 268435456

  - group: check
    job: clippy
    desc: clippy over every target, warnings denied
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && cargo clippy --all-targets --locked -- -D warnings
    jobs_flag: ""
    jobs_env: CARGO_BUILD_JOBS
    cpu_timeout: 900
    hint:
      est_duration_s: 120
      classification: cpu-bound
      preferred_inner_jobs: 8
      # Clippy holds the whole crate graph. This is the step most likely to be the memory high
      # water mark of the run, and the one worth a real number rather than a default.
      rss_baseline_bytes: 3221225472

  - group: check
    job: scripts
    desc: strict typing and no explicit Any in the Python operator tools
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && make scripts-check
    jobs_flag: ""
    cpu_timeout: 120
    hint:
      est_duration_s: 5
      classification: light
      rss_baseline_bytes: 536870912

  # The physical Android run is opt-in. Its evaluator is not: silence and wrong-language speech
  # are negative controls here, requiring no phone, browser, capture device or STT service.
  - group: check
    job: android-speech-self-test
    desc: offline controls for the Android rendered-speech evaluator
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 scripts/android-device-speech.py --self-test
    jobs_flag: ""
    cpu_timeout: 30
    hint:
      est_duration_s: 2
      classification: light
      rss_baseline_bytes: 268435456

  # Chrome's own installability verdict. Unlike the fake-DOM suite, this exercises manifest
  # parsing, icon loading, secure-origin rules and the selected display mode in the browser engine.
  - group: check
    job: pwa-installability
    desc: current Chromium CDP installability check with an Android viewport
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/pwa_installability.py
    jobs_flag: ""
    timeout: 60
    cpu_timeout: 30
    hint:
      resources: {browser: 1}
      est_duration_s: 5
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # `#18 offline-message-cache` in the browser engine: saved rows drawn across a real reload before
  # the network answers, one newest-page read, local view switches, a real fetch failure, sign-out
  # clearing, empty Cache Storage and no service worker. `#32 freshness-pill-overlap`: refreshing,
  # offline and failed, the pill clear of the view tabs and the list's header, #scroll-area unmoved,
  # and a scrolled reader held in place as the pill comes and goes.
  - group: check
    job: offline-cache-browser
    desc: saved-message snapshot in current Chromium at 412x915 and 360x800 Android viewports and a 1280x800 desk
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && python3 tests/offline_cache_browser.py
    jobs_flag: ""
    timeout: 90
    cpu_timeout: 45
    hint:
      resources: {browser: 1}
      est_duration_s: 12
      classification: latency-bound
      rss_baseline_bytes: 1073741824

  # ---- the build everything else needs ----------------------------------------------------------
  - group: build
    job: release
    desc: the release binary the server-shaped suites run against
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && cargo build --release --locked
    jobs_flag: ""
    jobs_env: CARGO_BUILD_JOBS
    cpu_timeout: 1800
    hint:
      est_duration_s: 240
      classification: cpu-bound
      preferred_inner_jobs: 16
      rss_baseline_bytes: 4294967296

  - group: smoke
    job: cli-help
    desc: the built service binary exposes its operator help without configuration
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && ./target/release/vibe-talk --help >/dev/null
    jobs_flag: ""
    deps: [build.release]
    timeout: 60
    cpu_timeout: 30
    hint:
      est_duration_s: 1
      classification: light
      rss_baseline_bytes: 134217728

  # ---- suites that need it ----------------------------------------------------------------------
  #
  # `cargo test` runs the Rust tests AND both page suites through their own harnesses, so each page
  # suite has one owner in the complete graph rather than being paid for twice.
  - group: test
    job: unit
    desc: the Rust suites, and the page suites through their harnesses
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && cargo test --release --locked
    jobs_flag: ""
    jobs_env: CARGO_BUILD_JOBS
    deps: [build.release]
    cpu_timeout: 1800
    hint:
      est_duration_s: 180
      classification: cpu-bound
      preferred_inner_jobs: 8
      rss_baseline_bytes: 3221225472

  # THE ONE THAT LEAKED. It starts a real server and drives a real Chromium at it. Boxed, its
  # descendants are reaped with it whether or not the script's own trap fires -- which is the whole
  # reason this file exists, because for six days that trap did not.
  - group: shots
    job: screenshots
    desc: the screenshot harness — a real server and a real browser
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && ./scripts/run.sh --screenshots --theme dark
    jobs_flag: ""
    deps: [build.release]
    # Wall, not only CPU: a browser waiting on a page that never loads burns no CPU at all, so a
    # CPU budget alone would let it hang until the run timeout. This is the hang backstop.
    timeout: 900
    cpu_timeout: 600
    hint:
      resources: {browser: 1}
      # MEASURED, not guessed. Everything in this block used to be an estimate for a step that had
      # never once started -- the `cmd` above did not parse, so the job failed in milliseconds and
      # no profile of it could exist. The first run that got through put the walk at 284s wall,
      # 170s CPU and a 682MB peak, against guesses of 120s and 4GiB. Both were wrong by more than
      # a factor of two, in opposite directions, which is the worst way for a scheduler estimate
      # to be wrong: it under-books the time and over-books the memory at the same time.
      #
      # 300 rather than 284 because this is a whole-walk figure and the walk grows a state at a
      # time; re-measure with `dagrun run --dag vibe-talk/tests.dag.yaml --selected
      # shots.screenshots --ignore-selected-deps` and read `.dagrun/profiles/step_profiles_*.csv`.
      # Unusually for this file, the number travels: at 0.60 effective cores this step is waiting,
      # not computing, so a slower machine does not stretch it the way it stretches clippy.
      est_duration_s: 300
      # latency-bound, not cpu-bound: most of its wall time is waiting for a page to settle, and
      # telling the scheduler otherwise makes it reserve cores it will not use. Confirmed by the
      # same run -- 0.60 effective cores over 284 seconds.
      classification: latency-bound
      preferred_inner_jobs: 4
      # 1GiB against a 682MB observed peak.
      #
      # This is NOT what the planner reserves for this step, and a previous version of this
      # comment said it was. `sizing.step_mem_cap_bytes` is "an explicit hard cap wins; otherwise
      # factor x the RSS baseline" -- so while `hard_mem_max_bytes` below is set, the baseline is
      # never consulted for the footprint sum. It is still worth being true: the visualiser reads
      # it, and `--refine-memory` compares profile-derived peaks against it.
      rss_baseline_bytes: 1073741824
      # THE CAP IS THE RESERVATION. That is the part worth knowing before making this number
      # comfortable: because an explicit cap wins outright, whatever is written here is what
      # `schedulable_peak_mem_bytes` adds up when it decides how many steps may run at once. A cap
      # set high "just to be safe" is not free -- it is spent against the run's memory budget for
      # the step's whole duration, which is the serialization #113 dagrun-memory-admission is
      # about, and this step is held for 284 seconds at a time.
      #
      # So: a backstop sized from the measurement rather than from imagination. 3GiB is 4.4x the
      # observed 682MB peak, which still catches a browser that genuinely runs away -- the thing
      # this cap exists for -- while reserving half of what 6GiB did. Re-measure before lowering
      # it further; `peak_bytes` in the profile CSV is the column.
      hard_mem_max_bytes: 3221225472
