  # theirs (`#280`); and at 1280x800 a reader 60 to 300px up the list's cards, the card docked under them,
  # on their card again by Ctrl+4 and Ctrl+3, though two columns put them at the foot of their cards, and
  # one who moved the cards in two columns where they moved to; and at 393x852 and 1280x800 a reader at
  # the foot of Main or All still there once the box takes back its room a second after Send, the sent
  # message drawn by a live read in that second and with the browser's scroll anchoring off, and after a
  # draft opened by More is settled elsewhere and the box takes the focus; and at 393x852 a reader who
  # sees only a long draft opened by More finding it where it stood through the
  # thread list and back and across Main and All (`#280`); and at 1280x800, that draft drawn taller in
