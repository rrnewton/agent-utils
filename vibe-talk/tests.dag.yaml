  # ---- suites that need it ----------------------------------------------------------------------
  #
  # The test binaries, built for `test.unit` in a step of their own, a habit from when a second step
  # ran them too and neither was to build them in its own box while the other waited on cargo's build
  # lock (the page suite's slices below now need none). `cargo test --release` builds the
  # dependencies again with the dev-dependencies' features, so this is most of what `test.unit` used
  # to spend before its first test ran.
  - group: build
